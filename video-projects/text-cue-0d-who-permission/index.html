<!doctype html>
<!--
  text-cue-0d-who-permission — Form-1 staged cue, Quiet Register v4. Gap-fill 0D, who-it's-for + permission (~1:03.5-1:17.5).
  TRANSPARENT alpha -> .mov for Resolve over full-frame A-roll. Staged reveal, 3 lines, final line weight shift.
  Two audience rows dim with CYAN #7ea4d8 arrows (connector register); permission line bright. NO red. Placement: bottom-left scrim x120 y790.
  HARD OUT by comp end (master 1:17.5) — samuelgursky lower-third + links card own 1:18.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: 'Geist Mono'; font-weight: 400; font-display: block; src: url(assets/fonts/GeistMono-400.woff2) format('woff2'); }
  @font-face { font-family: 'Geist Mono'; font-weight: 500; font-display: block; src: url(assets/fonts/GeistMono-500.woff2) format('woff2'); }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1920px; height:1080px; overflow:hidden; background:transparent; font-family:'Geist Mono',monospace; }
  #stage { position:relative; width:1920px; height:1080px; }

  #cue { position:absolute; left:120px; top:790px; }
  .scrim { display:inline-block; background:rgba(8,14,24,0.82); border-radius:10px;
           padding:28px 34px; box-shadow:0 12px 40px rgba(0,0,0,0.4); opacity:0; }
  .line { font-size:32px; letter-spacing:0.04em; line-height:1.6; white-space:nowrap;
          text-shadow:0 2px 18px rgba(0,0,0,0.65); color:#8995b0; font-weight:400; }
  .arw { color:#7ea4d8; font-weight:400; }
  #l2, #l3 { opacity:0; }
  #l3 { font-weight:500; }
</style>
</head>
<body data-hf-duration="14.0">
  <div id="stage" data-composition-id="text-cue-0d-who-permission" data-width="1920" data-height="1080" data-start="0" data-duration="14.0" data-track-index="1">
    <div id="cue" class="clip" data-start="0" data-duration="14.0" data-track-index="2">
      <div class="scrim">
        <div class="line" id="l1">solo creator <span class="arw">&rarr;</span> speeds it up</div>
        <div class="line" id="l2">newer <span class="arw">&rarr;</span> learn from it</div>
        <div class="line" id="l3">the repetitive part, off your plate</div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script>
    const tl = gsap.timeline({ paused: true });
    tl.to({}, { duration: 14.0 }, 0); // slot anchor

    // Entrance with L1 — scrim + first audience row fade in (Law-10 blur clears).
    tl.fromTo('.scrim', { opacity: 0, filter: 'blur(6px)' },
                        { opacity: 1, filter: 'blur(0px)', duration: 0.5, ease: 'power2.out' }, 0.6);

    // L2 staged reveal (second audience row).
    tl.fromTo('#l2', { opacity: 0, y: 10, filter: 'blur(4px)' },
                     { opacity: 1, y: 0, filter: 'blur(0px)', duration: 0.5, ease: 'power2.out' }, 5.0);

    // L3 staged reveal (permission line), then weight/emphasis brighten dim -> ink.
    tl.fromTo('#l3', { opacity: 0, y: 10, filter: 'blur(4px)' },
                     { opacity: 1, y: 0, filter: 'blur(0px)', duration: 0.5, ease: 'power2.out' }, 11.5);
    tl.to('#l3', { color: '#e9edf6', duration: 0.4, ease: 'power2.out' }, 12.0);

    // Exit — whole-cue opacity fade (fully out by comp end 14.0).
    tl.to('.scrim', { opacity: 0, duration: 1.0, ease: 'power2.in' }, 13.0);

    window.__timelines = window.__timelines || {};
    window.__timelines['text-cue-0d-who-permission'] = tl;
  </script>
</body>
</html>
