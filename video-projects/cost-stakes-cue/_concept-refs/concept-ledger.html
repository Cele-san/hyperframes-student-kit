<!doctype html>
<!--
  cost-stakes-cue CONCEPT 2 — "the one-way ledger" (imbalance).
  Fact: inflow is literally zero. OUT rail fills red in two hits ($350 -> ~$1,300);
  IN rail draws on... and NOTHING fills it. The emptiness is the punch.
  $0 prints bright ink (never red) at the empty rail's end.
  Quiet Register Form 1 · transparent · PREVIEW-ONLY: #preview-backdrop, #face-guide.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: 'Geist Mono'; font-weight: 400; font-display: block; src: url(assets/fonts/GeistMono-400.woff2) format('woff2'); }
  @font-face { font-family: 'Geist Mono'; font-weight: 500; font-display: block; src: url(assets/fonts/GeistMono-500.woff2) format('woff2'); }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1920px; height:1080px; overflow:hidden; background:transparent; font-family:'Geist Mono',monospace; }
  #stage { position:relative; width:1920px; height:1080px; }

  /* ---- PREVIEW ONLY (remove for final alpha .mov) ---- */
  #preview-backdrop { position:absolute; inset:0;
                      background:radial-gradient(ellipse 900px 700px at 960px 430px, #16273f 0%, #0A1628 70%); }
  #face-guide { position:absolute; inset:0; opacity:0.5; }
  #face-guide ellipse, #face-guide path { fill:none; stroke:#38537a; stroke-width:2; stroke-dasharray:8 8; }
  #face-guide text { fill:#38537a; font-family:'Geist Mono',monospace; font-size:18px; letter-spacing:0.08em; }
  /* ---------------------------------------------------- */

  #cue { position:absolute; left:120px; bottom:110px; width:760px; }
  .ledger-row { position:relative; height:86px; opacity:0; }
  .lbl { font-weight:500; font-size:20px; letter-spacing:0.12em; color:#8995b0;
         text-shadow:0 2px 18px rgba(0,0,0,0.65); }
  .rail { position:absolute; left:0; top:46px; width:640px; height:2px; background:#3a4c6b; }
  .fill { position:absolute; left:0; top:44px; width:640px; height:6px; background:#EF4444;
          border-radius:3px; }
  .figure { position:absolute; top:24px; font-weight:500; font-size:30px; letter-spacing:0.04em;
            text-shadow:0 2px 18px rgba(0,0,0,0.65); white-space:nowrap; opacity:0; }
  .figure .per { color:#8995b0; font-weight:400; font-size:24px; }
  #fig-week  { left:96px; color:#EF4444; top:-6px; }  /* clear of the OUT label, near the week tick */
  #fig-month { left:660px; color:#EF4444; top:32px; }
  #fig-zero  { left:660px; color:#e9edf6; top:32px; font-size:36px; }
  #tick-week { position:absolute; top:40px; width:2px; height:14px; background:#EF4444; opacity:0; }
</style>
</head>
<body data-hf-duration="12">
  <div id="stage" data-composition-id="concept-ledger" data-width="1920" data-height="1080" data-start="0" data-duration="12" data-track-index="1">

    <div id="preview-backdrop" class="clip" data-start="0" data-duration="12" data-track-index="2"></div>
    <svg id="face-guide" class="clip" data-start="0" data-duration="12" data-track-index="3"
         width="1920" height="1080" viewBox="0 0 1920 1080">
      <ellipse cx="960" cy="430" rx="170" ry="225"/>
      <path d="M 620 1080 C 640 800, 800 690, 960 690 C 1120 690, 1280 800, 1300 1080"/>
      <text x="850" y="330">A-ROLL FACE AREA</text>
      <text x="878" y="358">(preview only)</text>
    </svg>

    <div id="cue" class="clip" data-start="0" data-duration="12" data-track-index="4">
      <div class="ledger-row" id="row-out">
        <span class="lbl">OUT</span>
        <span class="figure" id="fig-week">$350 <span class="per">/ week</span></span>
        <div class="rail"></div>
        <div class="fill" id="out-fill"></div>
        <div id="tick-week" style="left:172px;"></div>
        <span class="figure" id="fig-month">~$1,300 <span class="per">/ month</span></span>
      </div>
      <div class="ledger-row" id="row-in" style="margin-top:10px;">
        <span class="lbl">IN</span>
        <div class="rail" id="in-rail"></div>
        <span class="figure" id="fig-zero">$0</span>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script>
    const tl = gsap.timeline({ paused: true });
    tl.to({}, { duration: 12 }, 0); // slot anchor

    // OUT row enters
    tl.fromTo('#row-out', { opacity: 0, y: 12, filter: 'blur(6px)' },
                          { opacity: 1, y: 0, filter: 'blur(0px)', duration: 0.5, ease: 'power2.out' }, 0.5);

    // Hit 1 — "$350 a week": fill runs to the week mark (350/1300 ≈ 27%)
    tl.fromTo('#out-fill', { scaleX: 0, transformOrigin: 'left center' },
                           { scaleX: 0.27, duration: 0.5, ease: 'power2.out' }, 1.1);
    tl.fromTo('#tick-week', { opacity: 0 }, { opacity: 1, duration: 0.2 }, 1.5);
    tl.fromTo('#fig-week', { opacity: 0, y: 8, filter: 'blur(4px)' },
                           { opacity: 1, y: 0, filter: 'blur(0px)', duration: 0.4, ease: 'power2.out' }, 1.25);

    // Hit 2 — "roughly $1,300 a month": fill extends to full rail
    tl.to('#out-fill', { scaleX: 1, duration: 0.7, ease: 'power2.inOut' }, 3.4);
    tl.fromTo('#fig-month', { opacity: 0, y: 8, filter: 'blur(4px)' },
                            { opacity: 1, y: 0, filter: 'blur(0px)', duration: 0.4, ease: 'power2.out' }, 3.9);

    // IN row — the rail draws on, deliberately... and stays empty. That IS the punch.
    tl.fromTo('#row-in', { opacity: 0, y: 12, filter: 'blur(6px)' },
                         { opacity: 1, y: 0, filter: 'blur(0px)', duration: 0.5, ease: 'power2.out' }, 5.6);
    tl.fromTo('#in-rail', { scaleX: 0, transformOrigin: 'left center' },
                          { scaleX: 1, duration: 1.2, ease: 'power2.inOut' }, 5.9);
    // beat of held emptiness, then $0 prints bright ink
    tl.fromTo('#fig-zero', { opacity: 0, filter: 'blur(4px)' },
                           { opacity: 1, filter: 'blur(0px)', duration: 0.45, ease: 'power2.out' }, 7.6);
    // the burn dims a step so the empty rail + $0 own the tableau
    tl.to('#row-out', { opacity: 0.75, duration: 0.6, ease: 'power2.out' }, 7.6);

    // Exit
    tl.to('#cue', { opacity: 0, duration: 1.0, ease: 'power2.in' }, 10.5);

    window.__timelines = window.__timelines || {};
    window.__timelines['concept-ledger'] = tl;
  </script>
</body>
</html>
