<!doctype html><html><head><meta charset="utf-8"><title>Garden cutout motion test</title><script src="assets/gsap.min.js"></script><style>
*{box-sizing:border-box}html,body{margin:0;width:1920px;height:1080px;overflow:hidden}#main{position:relative;width:1920px;height:1080px;overflow:hidden}.stage,.plate{position:absolute;inset:0;width:1920px;height:1080px}.plate{object-fit:fill}.plant{position:absolute;left:260px;top:95px;width:1229px;height:819px;transform-origin:43.5% 94%;filter:drop-shadow(3px 7px 4px #382b2520)}.puppet{position:absolute;width:100%;height:100%;inset:0}.flap{clip-path:polygon(47.7% 47%,47.7% 34%,52% 20%,60% 12%,83% 4%,81% 19%,79% 36%,70% 47%,59% 51%);transform-origin:48% 47%;backface-visibility:hidden}.lib{position:absolute;inset:0;width:1920px;height:1080px;opacity:0}.cut{position:absolute;inset:0;width:1920px;height:1080px;opacity:0;transform-origin:50% 80%}
</style></head><body><div id="main" data-composition-id="main" data-width="1920" data-height="1080" data-duration="14" data-fps="30"><div id="stage" class="stage clip" data-start="0" data-duration="14" data-track-index="1"><img id="paper" class="plate" src="assets/paper-soil.png">
<img id="soilframe" class="lib" src="assets/library-cutouts.png" style="clip-path:polygon(0 0,100% 0,100% 100%,0 100%,0 0,5% 7%,5% 88%,95% 88%,95% 7%,5% 7%);">
<img id="root" class="cut" src="assets/library-cutouts.png" style="clip-path:polygon(0 85%,16% 77%,40% 75%,73% 73%,85% 84%,95% 100%,0 100%)">
<img id="lefttop" class="cut" src="assets/library-cutouts.png" style="clip-path:polygon(13% 3%,51% 3%,51% 43%,35% 46%,19% 51%,13% 38%)">
<img id="leftbottom" class="cut" src="assets/library-cutouts.png" style="clip-path:polygon(1% 48%,36% 46%,36% 64%,28% 75%,21% 85%,8% 86%,1% 73%)">
<img id="middle" class="cut" src="assets/library-cutouts.png" style="clip-path:polygon(32% 52%,67% 46%,67% 72%,57% 80%,49% 86%,38% 88%,32% 73%)">
<img id="right" class="cut" src="assets/library-cutouts.png" style="clip-path:polygon(64% 52%,99% 46%,99% 81%,78% 88%,68% 89%,64% 72%)">
<div id="hero" class="plant"><img id="open" class="puppet" src="assets/plant-open.png"><img id="closed" class="puppet flap" src="assets/plant-closed.png"></div>
<img id="heroFinal" class="cut" src="assets/library-cutouts.png" style="clip-path:polygon(50% 3%,92% 3%,92% 42%,65% 44%,53% 50%,50% 45%)">
<img id="final" class="lib" src="assets/library-cutouts.png">
</div></div><script>
const tl=gsap.timeline({paused:true});window.__timelines={main:tl};
tl.fromTo('#hero',{scale:.94,rotation:-2},{scale:1,rotation:0,duration:.8,ease:'steps(8)',immediateRender:false},.2);
tl.to('#closed',{rotationY:-77,rotationX:-18,scaleX:.55,duration:1.25,ease:'steps(14)'},1.8);
tl.to('#closed',{opacity:0,duration:.16,ease:'steps(2)'},2.95);
tl.to('#hero',{x:252,y:147,scale:1.3,rotation:0,duration:1.8,ease:'steps(20)'},5);
tl.to('#paper',{scale:1.06,duration:1.8,ease:'steps(20)'},5);
tl.to('#heroFinal',{opacity:1,duration:.001,ease:'none'},6.8);
tl.to('#hero',{opacity:0,duration:.001,ease:'none'},6.8);
for(const [id,t,rot] of [['lefttop',7,-3],['leftbottom',7.55,2],['middle',8.1,-2],['right',8.65,3]]){
tl.fromTo('#'+id,{opacity:0,scale:.85,rotation:rot,y:20},{opacity:1,scale:1,rotation:0,y:0,duration:.65,ease:'steps(7)',immediateRender:false},t);
}
tl.to('#root',{opacity:1,duration:.65,ease:'steps(7)'},9.15);

tl.to('#final',{opacity:1,duration:.45,ease:'steps(5)'},10.2);
tl.to('#heroFinal,#lefttop,#leftbottom,#middle,#right,#root',{opacity:0,duration:.01},10.66);
</script></body></html>
