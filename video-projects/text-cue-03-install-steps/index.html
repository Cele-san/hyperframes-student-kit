<!doctype html>
<!--
  text-cue-03-install-steps — Form-1 staged checklist, Quiet Register v4. Beat 4 install hold.
  TRANSPARENT alpha -> .mov for Resolve over the ~76s terminal self-install (~2:44-3:04).
  Staged reveal synced to the agent's on-screen actions; each item fades in then draws an underline
  as it completes. Verbatim step words. Placement: left-center scrim x300 y600. Quiet, no ticks.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: 'Geist Mono'; font-weight: 400; font-display: block; src: url(assets/fonts/GeistMono-400.woff2) format('woff2'); }
  @font-face { font-family: 'Geist Mono'; font-weight: 500; font-display: block; src: url(assets/fonts/GeistMono-500.woff2) format('woff2'); }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1920px; height:1080px; overflow:hidden; background:transparent; font-family:'Geist Mono',monospace; }
  #stage { position:relative; width:1920px; height:1080px; }

  #cue { position:absolute; left:300px; top:600px; }
  .scrim { display:inline-block; background:rgba(8,14,24,0.82); border-radius:10px;
           padding:30px 36px; box-shadow:0 12px 40px rgba(0,0,0,0.4); opacity:0; }
  .item { font-size:32px; letter-spacing:0.04em; line-height:1.62; color:#e9edf6; font-weight:500;
          text-shadow:0 2px 18px rgba(0,0,0,0.65); opacity:0; }
  .w { position:relative; display:inline-block; }
  .rule { position:absolute; left:0; bottom:-6px; width:100%; height:2px; background:#e9edf6; opacity:0.8; }
</style>
</head>
<body data-hf-duration="15">
  <div id="stage" data-composition-id="text-cue-03-install-steps" data-width="1920" data-height="1080" data-start="0" data-duration="15" data-track-index="1">
    <div id="cue" class="clip" data-start="0" data-duration="15" data-track-index="2">
      <div class="scrim">
        <div class="item" id="i1"><span class="w"><span>clone</span><div class="rule" id="r1"></div></span></div>
        <div class="item" id="i2"><span class="w"><span>isolated venv</span><div class="rule" id="r2"></div></span></div>
        <div class="item" id="i3"><span class="w"><span>wire it up</span><div class="rule" id="r3"></div></span></div>
        <div class="item" id="i4"><span class="w"><span>verify</span><div class="rule" id="r4"></div></span></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script>
    const tl = gsap.timeline({ paused: true });
    tl.to({}, { duration: 15 }, 0); // slot anchor

    // Scrim establishes just before the first step.
    tl.fromTo('.scrim', { opacity: 0, filter: 'blur(6px)' },
                        { opacity: 1, filter: 'blur(0px)', duration: 0.5, ease: 'power2.out' }, 2.6);

    // Staged checklist — item fades in, underline draws +0.4s as it "completes".
    const steps = [['#i1','#r1',3.0], ['#i2','#r2',4.8], ['#i3','#r3',7.5], ['#i4','#r4',13.6]];
    steps.forEach(([item, rule, t]) => {
      tl.fromTo(item, { opacity: 0, y: 10, filter: 'blur(4px)' },
                      { opacity: 1, y: 0, filter: 'blur(0px)', duration: 0.5, ease: 'power2.out' }, t);
      tl.fromTo(rule, { scaleX: 0, transformOrigin: 'left center' },
                      { scaleX: 1, duration: 0.45, ease: 'power2.inOut' }, t + 0.4);
    });

    // Exit — whole-cue opacity fade.
    tl.to('.scrim', { opacity: 0, duration: 1.0, ease: 'power2.in' }, 14.0);

    window.__timelines = window.__timelines || {};
    window.__timelines['text-cue-03-install-steps'] = tl;
  </script>
</body>
</html>
