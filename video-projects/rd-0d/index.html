<!doctype html>
<!-- rd-0d — HYBRID, cue-0d-who-permission (14s, full-frame A-roll, x120 y760). FLOAT rows 1-2
     (cyan arrows) + BIG TYPE payoff "the repetitive part, off your plate" (blossom). Backglow +
     drift, hard cut exit before the 77.5 hard-out (links card owns 1:18). -->
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family:'Geist Mono'; font-weight:400; font-display:block; src:url(assets/fonts/GeistMono-400.woff2) format('woff2'); }
  @font-face { font-family:'Geist Mono'; font-weight:500; font-display:block; src:url(assets/fonts/GeistMono-500.woff2) format('woff2'); }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1920px; height:1080px; overflow:hidden; background:transparent; font-family:'Geist Mono',monospace; }
  #stage { position:relative; width:1920px; height:1080px; }
  #vig { position:absolute; left:-240px; top:-160px; width:1550px; height:540px; opacity:0;
         background:radial-gradient(ellipse 60% 54% at 42% 48%, rgba(5,9,17,0.64) 0%, rgba(5,9,17,0.4) 52%, rgba(5,9,17,0) 76%); }
  #cue { position:absolute; left:120px; top:760px; }
  .line { font-size:31px; letter-spacing:0.03em; white-space:nowrap; font-weight:400; color:#8995b0;
          text-shadow:0 2px 12px rgba(0,0,0,0.92), 0 0 44px rgba(0,0,0,0.6); opacity:0; margin-top:12px; }
  #l1 { margin-top:0; }
  .arw { color:#5BA8D8; font-weight:500; }
  #pay { display:block; margin-top:16px; font-weight:500; font-size:62px; letter-spacing:-0.01em;
         color:#e9edf6; opacity:0; transform-origin:left bottom;
         text-shadow:0 3px 14px rgba(0,0,0,0.92), 0 0 60px rgba(0,0,0,0.6); }
</style>
</head>
<body data-hf-duration="14">
  <div id="stage" data-composition-id="rd-0d" data-width="1920" data-height="1080" data-start="0" data-duration="14" data-track-index="1">
    <div id="cue" class="clip" data-start="0" data-duration="14" data-track-index="2">
      <div id="vig"></div>
      <div id="txt">
        <div class="line" id="l1">solo creator <span class="arw">&rarr;</span> speeds it up</div>
        <div class="line" id="l2">newer <span class="arw">&rarr;</span> learn from it</div>
        <span id="pay">the repetitive part, off your plate</span>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script>
    const tl = gsap.timeline({ paused: true });
    tl.to({}, { duration: 14 }, 0);
    tl.to('#vig', { opacity: 1, duration: 0.9, ease: 'power2.out' }, 0.3);
    tl.fromTo('#txt', { x: 0 }, { x: 12, duration: 12.8, ease: 'none' }, 0.6);
    const slide = (sel, at) => tl.fromTo(sel, { opacity:0, x:-24, filter:'blur(5px)' },
      { opacity:1, x:0, filter:'blur(0px)', duration:0.25, ease:'power2.out' }, at);
    slide('#l1', 0.6);
    slide('#l2', 5.0);
    // payoff goes BIG TYPE: pop + blossom
    tl.fromTo('#pay', { opacity:0, scale:1.06, y:6, filter:'blur(3px)' },
      { opacity:1, scale:1, y:0, filter:'blur(0px)', duration:0.12, ease:'power3.out' }, 11.5);
    tl.to('#pay', { color:'#F0A8C2', duration:0.35, ease:'power2.out' }, 11.85);
    // hard cut exit well before the 77.5 hard-out
    tl.to('#cue', { opacity: 0, duration: 0.04, ease: 'none' }, 13.5);
    window.__timelines = window.__timelines || {};
    window.__timelines['rd-0d'] = tl;
  </script>
</body>
</html>
