<!doctype html>
<!--
  text-cue-01-codified — Form-1 text cue, Quiet Register v4. Beat 3 repo hold.
  TRANSPARENT alpha canvas -> .mov for Resolve over the GitHub-page hold (~1:48.8-1:54.3).
  Copy verbatim: "...all been codified". Weight/emphasis shift on `codified` + underline draw.
  Placement: bottom-left scrim x120 y880 (clear of the PIP cam bottom-right). No color pop.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: 'Geist Mono'; font-weight: 400; font-display: block; src: url(assets/fonts/GeistMono-400.woff2) format('woff2'); }
  @font-face { font-family: 'Geist Mono'; font-weight: 500; font-display: block; src: url(assets/fonts/GeistMono-500.woff2) format('woff2'); }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1920px; height:1080px; overflow:hidden; background:transparent; font-family:'Geist Mono',monospace; }
  #stage { position:relative; width:1920px; height:1080px; }

  #cue { position:absolute; left:120px; top:880px; }
  .scrim { display:inline-block; background:rgba(8,14,24,0.82); border-radius:10px;
           padding:28px 34px; box-shadow:0 12px 40px rgba(0,0,0,0.4); opacity:0; }
  .line { font-size:32px; letter-spacing:0.04em; white-space:nowrap;
          text-shadow:0 2px 18px rgba(0,0,0,0.65); }
  .dim  { color:#8995b0; font-weight:400; }
  .emph-wrap { position:relative; display:inline-block; }
  .emph { color:#8995b0; font-weight:500; }
  .rule { position:absolute; left:0; bottom:-8px; width:100%; height:2px;
          background:#e9edf6; opacity:0.85; }
</style>
</head>
<body data-hf-duration="5.5">
  <div id="stage" data-composition-id="text-cue-01-codified" data-width="1920" data-height="1080" data-start="0" data-duration="5.5" data-track-index="1">
    <div id="cue" class="clip" data-start="0" data-duration="5.5" data-track-index="2">
      <div class="scrim">
        <span class="line"><span class="dim">&hellip;all been </span><span class="emph-wrap"><span class="emph" id="word">codified</span><div class="rule" id="rule"></div></span></span>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script>
    const tl = gsap.timeline({ paused: true });
    tl.to({}, { duration: 5.5 }, 0); // slot anchor

    // Entrance — sentence dims in over a 1s fade with Law-10 blur clearing.
    tl.fromTo('.scrim', { opacity: 0, filter: 'blur(6px)' },
                        { opacity: 1, filter: 'blur(0px)', duration: 1.0, ease: 'power2.out' }, 0.3);

    // `codified` brightens dim -> ink (weight/emphasis shift, color only, no reflow).
    tl.to('#word', { color: '#e9edf6', duration: 0.4, ease: 'power2.out' }, 1.0);

    // Underline draw beneath `codified`.
    tl.fromTo('#rule', { scaleX: 0, transformOrigin: 'left center' },
                       { scaleX: 1, duration: 0.45, ease: 'power2.inOut' }, 1.4);

    // Exit — whole-cue opacity fade.
    tl.to('.scrim', { opacity: 0, duration: 1.0, ease: 'power2.in' }, 4.3);

    window.__timelines = window.__timelines || {};
    window.__timelines['text-cue-01-codified'] = tl;
  </script>
</body>
</html>
