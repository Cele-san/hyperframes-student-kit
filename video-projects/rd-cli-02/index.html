<!doctype html>
<!--
  rd-cli-02 — CLI-NATIVE reference (word-synced editorial redesign, cue-02 setup prompt).
  The system "types" the command: cyan > marker + character typing (~28 cps) of
  "Help me set up this repo" with a block cursor riding the edge, then two output rows snap
  in like stdout. L3 "plan · high · enter" brightens to ink. No scrim. Alpha over the Claude
  Code dark zone ~2:21-2:32.5.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family:'Geist Mono'; font-weight:400; font-display:block; src:url(assets/fonts/GeistMono-400.woff2) format('woff2'); }
  @font-face { font-family:'Geist Mono'; font-weight:500; font-display:block; src:url(assets/fonts/GeistMono-500.woff2) format('woff2'); }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1920px; height:1080px; overflow:hidden; background:transparent; font-family:'Geist Mono',monospace; }
  #stage { position:relative; width:1920px; height:1080px; }

  /* text backglow — soft radial dark pool directly under the text so it pops off footage */
  #vig { position:absolute; left:-260px; top:-200px; width:1560px; height:640px; opacity:0;
         background:radial-gradient(ellipse 62% 55% at 42% 48%, rgba(5,9,17,0.66) 0%, rgba(5,9,17,0.42) 52%, rgba(5,9,17,0) 76%); }

  /* upper-left clear zone — the real app's mode dropdown owns center-frame y620-940 */
  #cue { position:absolute; left:140px; top:170px; }
  .prompt { white-space:nowrap; font-size:40px; letter-spacing:0.02em;
            text-shadow:0 2px 10px rgba(0,0,0,0.9), 0 0 40px rgba(0,0,0,0.6); opacity:0; }
  .marker { color:#5BA8D8; font-weight:500; margin-right:16px; }
  #typed { display:inline-block; overflow:hidden; white-space:nowrap; vertical-align:bottom;
           width:0; color:#e9edf6; font-weight:500; }
  .cursor { display:inline-block; width:15px; height:36px; background:#e9edf6; vertical-align:bottom;
            margin-left:2px; margin-bottom:2px; opacity:0; }

  .out { display:block; margin-top:24px; font-size:34px; letter-spacing:0.02em; color:#8995b0;
         font-weight:400; white-space:nowrap; opacity:0;
         text-shadow:0 2px 10px rgba(0,0,0,0.9), 0 0 40px rgba(0,0,0,0.6); }
  .out .tick { color:#5BA8D8; margin-right:14px; font-weight:500; }
</style>
</head>
<body data-hf-duration="11.5">
  <div id="stage" data-composition-id="rd-cli-02" data-width="1920" data-height="1080" data-start="0" data-duration="11.5" data-track-index="1">
    <div id="cue" class="clip" data-start="0" data-duration="11.5" data-track-index="2">
      <div id="vig"></div>
      <div id="txt">
        <div class="prompt" id="prompt"><span class="marker">&rsaquo;</span><span id="typed">Help me set up this repo</span><span class="cursor" id="cursor"></span></div>
        <span class="out" id="o1"><span class="tick">&#8250;</span>[ paste the MCP link ]</span>
        <span class="out" id="o2"><span class="tick">&#10003;</span>plan &middot; high &middot; enter</span>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script>
    const tl = gsap.timeline({ paused: true });
    tl.to({}, { duration: 11.5 }, 0);

    const CHARS = 23;            // "Help me set up this repo"
    const CW = 24;              // px per glyph @40px Geist Mono
    const typeDur = CHARS / 28; // ~0.82s at 28 cps

    // vignette breathes in just ahead of the text, out with the exit
    tl.to('#vig', { opacity: 1, duration: 0.8, ease: 'power2.out' }, 0.15);
    tl.to('#vig', { opacity: 0, duration: 0.5, ease: 'power2.in' }, 10.6);

    // slow hold-drift — the whole stack creeps 10px right over the cue so holds never freeze
    tl.fromTo('#txt', { x: 0 }, { x: 10, duration: 10.3, ease: 'none' }, 0.3);

    tl.to('#prompt', { opacity: 1, duration: 0.25, ease: 'power2.out' }, 0.3);
    tl.to('#cursor', { opacity: 1, duration: 0.1 }, 0.4);
    // character typing — inline-block width grows in glyph steps, cursor rides the edge
    tl.fromTo('#typed', { width: 0 }, { width: CHARS * CW, duration: typeDur, ease: `steps(${CHARS})` }, 0.55);
    // cursor blink during the hold after typing
    tl.to('#cursor', { opacity: 0, duration: 0.45, repeat: 5, yoyo: true, ease: 'steps(1)' }, 1.6);
    tl.to('#cursor', { opacity: 0, duration: 0.2, overwrite: 'auto' }, 4.4);

    // output rows snap in like stdout
    tl.fromTo('#o1', { opacity:0, y:6 }, { opacity:1, y:0, duration:0.15, ease:'power2.out' }, 3.6);
    tl.fromTo('#o2', { opacity:0, y:6 }, { opacity:1, y:0, duration:0.15, ease:'power2.out' }, 5.6);
    // L3 brightens to ink (operative row)
    tl.to('#o2', { color:'#e9edf6', duration:0.4, ease:'power2.out' }, 6.2);

    // exit — quick collapse
    tl.to('#cue', { opacity:0, y:-14, duration:0.4, ease:'power2.in' }, 10.6);

    window.__timelines = window.__timelines || {};
    window.__timelines['rd-cli-02'] = tl;
  </script>
</body>
</html>
