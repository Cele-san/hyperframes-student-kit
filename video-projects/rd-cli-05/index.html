<!doctype html>
<!-- rd-cli-05 — CLI-NATIVE, cue-05-model-strategy (23s, x480 y300). Two config rows snap in:
     OPUS → plan & brainstorm / SONNET 5 → save tokens. Models ink 500, arrows+labels cyan.
     Long hold covers the VO caveat; backglow + drift + collapse exit. -->
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family:'Geist Mono'; font-weight:400; font-display:block; src:url(assets/fonts/GeistMono-400.woff2) format('woff2'); }
  @font-face { font-family:'Geist Mono'; font-weight:500; font-display:block; src:url(assets/fonts/GeistMono-500.woff2) format('woff2'); }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1920px; height:1080px; overflow:hidden; background:transparent; font-family:'Geist Mono',monospace; }
  #stage { position:relative; width:1920px; height:1080px; }
  #vig { position:absolute; left:-260px; top:-190px; width:1450px; height:480px; opacity:0;
         background:radial-gradient(ellipse 62% 55% at 42% 48%, rgba(5,9,17,0.66) 0%, rgba(5,9,17,0.42) 52%, rgba(5,9,17,0) 76%); }
  #cue { position:absolute; left:480px; top:300px; }
  .row { white-space:nowrap; font-size:40px; letter-spacing:0.02em; opacity:0; margin-top:26px;
         text-shadow:0 2px 10px rgba(0,0,0,0.9), 0 0 40px rgba(0,0,0,0.6); }
  #r1 { margin-top:0; }
  .model { color:#e9edf6; font-weight:500; }
  .arw { color:#5BA8D8; font-weight:400; }
</style>
</head>
<body data-hf-duration="23">
  <div id="stage" data-composition-id="rd-cli-05" data-width="1920" data-height="1080" data-start="0" data-duration="23" data-track-index="1">
    <div id="cue" class="clip" data-start="0" data-duration="23" data-track-index="2">
      <div id="vig"></div>
      <div id="txt">
        <div class="row" id="r1"><span class="model">OPUS</span><span class="arw"> &rarr; plan &amp; brainstorm</span></div>
        <div class="row" id="r2"><span class="model">SONNET 5</span><span class="arw"> &rarr; save tokens</span></div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script>
    const tl = gsap.timeline({ paused: true });
    tl.to({}, { duration: 23 }, 0);
    tl.to('#vig', { opacity: 1, duration: 0.8, ease: 'power2.out' }, 3.8);
    tl.to('#vig', { opacity: 0, duration: 0.5, ease: 'power2.in' }, 21.9);
    tl.fromTo('#txt', { x: 0 }, { x: 14, duration: 18.2, ease: 'none' }, 4.0);

    const snap = (sel, at) => tl.fromTo(sel, { opacity:0, y:6 },
      { opacity:1, y:0, duration:0.15, ease:'power2.out' }, at);
    snap('#r1', 4.2);
    snap('#r2', 9.0);
    // hold through the VO caveat (nothing new on screen — deliberate)

    tl.to('#cue', { opacity:0, y:-14, duration:0.4, ease:'power2.in' }, 22.2);
    window.__timelines = window.__timelines || {};
    window.__timelines['rd-cli-05'] = tl;
  </script>
</body>
</html>
