<!doctype html>
<!--
  proto-0d-engaged — ENGAGED treatment prototype (cue 0D). All 4 levers Andy picked:
  (1) accent color — payoff word blossom, arrows cyan; (2) livelier motion — per-line clip
  wipe + payoff highlight-sweep + live beam cursor; (3) dressed scrim — left accent bar +
  top gradient + scrim scale-in; (4) punchier — payoff bumped to 38px, heavier presence.
  Transparent alpha over the close A-roll ~1:03.5. Copy verbatim.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family:'Geist Mono'; font-weight:400; font-display:block; src:url(assets/fonts/GeistMono-400.woff2) format('woff2'); }
  @font-face { font-family:'Geist Mono'; font-weight:500; font-display:block; src:url(assets/fonts/GeistMono-500.woff2) format('woff2'); }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1920px; height:1080px; overflow:hidden; background:transparent; font-family:'Geist Mono',monospace; }
  #stage { position:relative; width:1920px; height:1080px; }

  #cue { position:absolute; left:120px; top:770px; }
  .scrim { position:relative; display:inline-block; padding:30px 40px 30px 42px; border-radius:12px;
           background:linear-gradient(180deg, rgba(255,255,255,0.06) 0%, rgba(255,255,255,0) 42%), rgba(8,14,24,0.86);
           box-shadow:0 14px 46px rgba(0,0,0,0.46); opacity:0; transform-origin:left center; }
  .bar { position:absolute; left:0; top:14px; bottom:14px; width:3px; border-radius:3px;
         background:#F0A8C2; transform:scaleY(0); transform-origin:top center; }
  .row { position:relative; overflow:hidden; margin:7px 0; }
  .row .txt { display:inline-block; font-weight:500; font-size:31px; letter-spacing:0.04em;
              color:#8995b0; white-space:nowrap; text-shadow:0 2px 18px rgba(0,0,0,0.65); }
  .row .txt .arrow { color:#5BA8D8; font-weight:500; }        /* cyan connector */
  #r3 .txt { font-size:38px; color:#8995b0; }                 /* payoff, punchier */
  #r3 .pay { position:relative; }
  #sweep { position:absolute; left:-6px; right:-6px; top:2px; bottom:2px; border-radius:4px;
           background:rgba(240,168,194,0.16); transform:scaleX(0); transform-origin:left center; }
  #beam { display:inline-block; width:3px; height:34px; margin-left:4px; vertical-align:-6px;
          background:#F0A8C2; opacity:0; }
</style>
</head>
<body data-hf-duration="14">
  <div id="stage" data-composition-id="proto-0d-engaged" data-width="1920" data-height="1080" data-start="0" data-duration="14" data-track-index="1">
    <div id="cue" class="clip" data-start="0" data-duration="14" data-track-index="2">
      <div class="scrim">
        <div class="bar" id="bar"></div>
        <div class="row" id="r1"><span class="txt">solo creator <span class="arrow">&rarr;</span> speeds it up</span></div>
        <div class="row" id="r2"><span class="txt">newer <span class="arrow">&rarr;</span> learn from it</span></div>
        <div class="row" id="r3"><span class="txt"><span class="pay"><span id="sweep"></span>the repetitive part, off your plate</span><span id="beam"></span></span></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script>
    const tl = gsap.timeline({ paused: true });
    tl.to({}, { duration: 14 }, 0);

    // scrim scales/draws in + accent bar wipes down
    tl.fromTo('.scrim', { opacity:0, scaleX:0.82, filter:'blur(6px)' },
                        { opacity:1, scaleX:1, filter:'blur(0px)', duration:0.55, ease:'power3.out' }, 0.3);
    tl.fromTo('#bar', { scaleY:0 }, { scaleY:1, duration:0.5, ease:'power2.out' }, 0.5);

    // per-line reveal: clip wipe left->right + y-drift (staged to VO)
    const rowIn = (sel, at) => {
      tl.fromTo(sel+' .txt', { clipPath:'inset(0 100% 0 0)', y:8, filter:'blur(4px)' },
                             { clipPath:'inset(0 0% 0 0)', y:0, filter:'blur(0px)', duration:0.5, ease:'power2.out' }, at);
    };
    rowIn('#r1', 0.7);
    rowIn('#r2', 5.2);
    rowIn('#r3', 11.7);

    // payoff lands: highlight-sweep + word to blossom + beam blink
    tl.fromTo('#sweep', { scaleX:0 }, { scaleX:1, duration:0.4, ease:'power2.inOut' }, 12.0);
    tl.to('#r3 .txt', { color:'#F0A8C2', duration:0.4, ease:'power2.out' }, 12.15);
    tl.to('#beam', { opacity:1, duration:0.12, repeat:5, yoyo:true, ease:'none' }, 12.2);
    tl.to('#beam', { opacity:0, duration:0.2 }, 13.2);

    // exit
    tl.to('.scrim', { opacity:0, y:-10, duration:0.9, ease:'power2.in' }, 13.0);

    window.__timelines = window.__timelines || {};
    window.__timelines['proto-0d-engaged'] = tl;
  </script>
</body>
</html>
