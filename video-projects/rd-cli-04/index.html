<!doctype html>
<!-- rd-cli-04 — CLI-NATIVE, cue-04-project-prompt (18.5s, x480 y340). Prompt types
     "footage link · script link", then two stdout rows; L3 "use the brainstorm skill"
     brightens. Backglow + drift + collapse exit. -->
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family:'Geist Mono'; font-weight:400; font-display:block; src:url(assets/fonts/GeistMono-400.woff2) format('woff2'); }
  @font-face { font-family:'Geist Mono'; font-weight:500; font-display:block; src:url(assets/fonts/GeistMono-500.woff2) format('woff2'); }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1920px; height:1080px; overflow:hidden; background:transparent; font-family:'Geist Mono',monospace; }
  #stage { position:relative; width:1920px; height:1080px; }
  #vig { position:absolute; left:-260px; top:-190px; width:1400px; height:560px; opacity:0;
         background:radial-gradient(ellipse 62% 55% at 42% 48%, rgba(5,9,17,0.66) 0%, rgba(5,9,17,0.42) 52%, rgba(5,9,17,0) 76%); }
  #cue { position:absolute; left:480px; top:340px; }
  .prompt { white-space:nowrap; font-size:38px; letter-spacing:0.02em;
            text-shadow:0 2px 10px rgba(0,0,0,0.9), 0 0 40px rgba(0,0,0,0.6); opacity:0; }
  .marker { color:#5BA8D8; font-weight:500; margin-right:16px; }
  #typed { display:inline-block; overflow:hidden; white-space:nowrap; vertical-align:bottom;
           width:0; color:#e9edf6; font-weight:500; }
  .cursor { display:inline-block; width:14px; height:34px; background:#e9edf6; vertical-align:bottom;
            margin-left:2px; margin-bottom:2px; opacity:0; }
  .out { display:block; margin-top:22px; font-size:32px; letter-spacing:0.02em; color:#8995b0;
         font-weight:400; white-space:nowrap; opacity:0;
         text-shadow:0 2px 10px rgba(0,0,0,0.9), 0 0 40px rgba(0,0,0,0.6); }
  .out .tick { color:#5BA8D8; margin-right:14px; font-weight:500; }
</style>
</head>
<body data-hf-duration="18.5">
  <div id="stage" data-composition-id="rd-cli-04" data-width="1920" data-height="1080" data-start="0" data-duration="18.5" data-track-index="1">
    <div id="cue" class="clip" data-start="0" data-duration="18.5" data-track-index="2">
      <div id="vig"></div>
      <div id="txt">
        <div class="prompt" id="prompt"><span class="marker">&rsaquo;</span><span id="typed">footage link &middot; script link</span><span class="cursor" id="cursor"></span></div>
        <span class="out" id="o1"><span class="tick">&#8250;</span>first two minutes</span>
        <span class="out" id="o2"><span class="tick">&#10003;</span>use the brainstorm skill</span>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script>
    const tl = gsap.timeline({ paused: true });
    tl.to({}, { duration: 18.5 }, 0);
    const CHARS = 27, CW = 22.9;           // "footage link · script link"
    const typeDur = CHARS / 28;

    tl.to('#vig', { opacity: 1, duration: 0.8, ease: 'power2.out' }, 0.4);
    tl.to('#vig', { opacity: 0, duration: 0.5, ease: 'power2.in' }, 17.6);
    tl.fromTo('#txt', { x: 0 }, { x: 12, duration: 16.9, ease: 'none' }, 0.6);

    tl.to('#prompt', { opacity: 1, duration: 0.25, ease: 'power2.out' }, 0.7);
    tl.to('#cursor', { opacity: 1, duration: 0.1 }, 0.8);
    tl.fromTo('#typed', { width: 0 }, { width: CHARS * CW, duration: typeDur, ease: `steps(${CHARS})` }, 0.95);
    tl.to('#cursor', { opacity: 0, duration: 0.45, repeat: 7, yoyo: true, ease: 'steps(1)' }, 2.1);
    tl.to('#cursor', { opacity: 0, duration: 0.2, overwrite: 'auto' }, 5.9);

    tl.fromTo('#o1', { opacity:0, y:6 }, { opacity:1, y:0, duration:0.15, ease:'power2.out' }, 11.7);
    tl.fromTo('#o2', { opacity:0, y:6 }, { opacity:1, y:0, duration:0.15, ease:'power2.out' }, 16.0);
    tl.to('#o2', { color:'#e9edf6', duration:0.4, ease:'power2.out' }, 16.5);

    tl.to('#cue', { opacity:0, y:-14, duration:0.4, ease:'power2.in' }, 17.8);
    window.__timelines = window.__timelines || {};
    window.__timelines['rd-cli-04'] = tl;
  </script>
</body>
</html>
