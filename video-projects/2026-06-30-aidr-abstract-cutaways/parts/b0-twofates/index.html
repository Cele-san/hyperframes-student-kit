<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>b0-twofates</title>
<style>
  html, body { margin: 0; padding: 0; background: #000; }
  #b0-twofates-root {
    position: relative; width: 1920px; height: 1080px;
    background: #050b13; overflow: hidden;
    font-family: Inter, sans-serif;
  }
  .stage { position: absolute; inset: 0; }
  .cam { position: absolute; inset: 0; }
  .grid-tex { position: absolute; inset: 0; opacity: .5;
    background: repeating-linear-gradient(0deg, rgba(242,245,248,.022) 0 1px, transparent 1px 96px),
                repeating-linear-gradient(90deg, rgba(242,245,248,.022) 0 1px, transparent 1px 96px);
    background-position: 0px 0px, 0px 0px; }
  .grain { position: absolute; inset: 0; pointer-events: none; opacity: .55;
    background-image:
      radial-gradient(circle at 1px 1px, rgba(255,255,255,.03) 1px, transparent 1px),
      radial-gradient(circle at 2px 3px, rgba(255,255,255,.02) 1px, transparent 1px),
      radial-gradient(circle at 4px 2px, rgba(255,255,255,.015) 1px, transparent 1px);
    background-size: 3px 3px, 5px 5px, 7px 7px; }
  .vignette { position: absolute; inset: 0; pointer-events: none; opacity: .72;
    background: radial-gradient(ellipse at center, transparent 42%, rgba(0,0,0,.6) 100%); }
  .kicker { position: absolute; left: 96px; top: 72px;
    font: 600 24px 'JetBrains Mono', monospace; letter-spacing: .14em; color: #5a7194; }
  .grp { position: absolute; top: 415px; width: 720px; height: 150px; }
  #grpSrc  { left: 600px; }
  #grpLeft { left: 120px; }
  #grpRight{ left: 1080px; }
  .seg { position: absolute; top: 0; height: 150px; border-radius: 6px;
    background: #2a4a80; border: 2px solid #3a5f9e; box-sizing: border-box; }
  .hdl { position: absolute; top: 50%; width: 5px; height: 46px; margin-top: -23px;
    border-radius: 3px; background: #F2F5F8; }
  .hdl.l { left: -2px; } .hdl.r { right: -2px; }
  .slab { position: absolute; inset: 0; border-radius: 10px;
    background: linear-gradient(160deg, #24395e 0%, #16233c 55%, #1d2f4e 100%);
    border: 2px solid #33496f; box-shadow: inset 0 2px 0 rgba(242,245,248,.14);
    box-sizing: border-box; overflow: hidden; }
  .gloss { position: absolute; top: -20%; left: 0; width: 22%; height: 140%;
    background: linear-gradient(100deg, transparent, rgba(242,245,248,.16), transparent);
    transform: skewX(-12deg); }
  .badcut { position: absolute; width: 9px; border-radius: 3px; background: #e25b6e;
    box-shadow: 0 0 16px rgba(226,91,110,.8); opacity: 0; }
  .fatetitle { position: absolute; top: 330px; font: 600 23px 'JetBrains Mono', monospace;
    letter-spacing: .12em; }
  #titleL { left: 120px; width: 720px; text-align: center; color: #5a7194; }
  #titleR { left: 1080px; width: 720px; text-align: center; color: #F0A8C2; }
  .fatelab { position: absolute; top: 610px; font: 500 26px Inter, sans-serif; text-align: center; }
  #labL { left: 120px; width: 720px; color: #8fa3c0; }
  #labR { left: 1080px; width: 720px; color: #F2F5F8; }
  .fatelab b { font-weight: 700; }
  #labL b { color: #c98a9a; } #labR b { color: #F0A8C2; }
  #cursor { position: absolute; left: 0; top: 0; transform-origin: 3px 3px; z-index: 5; }
  .endlab { position: absolute; left: 96px; bottom: 84px;
    font: 600 26px 'JetBrains Mono', monospace; color: #F0A8C2; letter-spacing: .06em; }
</style>
</head>
<body>
<div id="b0-twofates-root" data-composition-id="b0-twofates" data-start="0"
     data-duration="12" data-width="1920" data-height="1080">
  <div class="stage clip" id="stage" data-start="0" data-duration="12" data-track-index="0">
    <div class="cam" id="cam">
      <div class="grid-tex"></div>
      <div class="kicker" id="kicker">TWO WAYS TO GET YOUR EDIT BACK</div>
      <div class="fatetitle" id="titleL">THE VIRAL VERSION</div>
      <div class="fatetitle" id="titleR">MINE</div>
      <div class="grp" id="grpSrc"></div>
      <div class="grp" id="grpLeft"><div class="slab" id="slab"><div class="gloss" id="gloss"></div></div></div>
      <div class="grp" id="grpRight"></div>
      <div class="fatelab" id="labL">final.mp4 · <b>1 FILE · 0 HANDLES</b></div>
      <div class="fatelab" id="labR">real timeline · <b>162 CLIPS · EVERY CUT EDITABLE</b></div>
      <svg id="cursor" width="40" height="44" viewBox="0 0 40 44">
        <path d="M3 2 L3 34 L12 26 L18 40 L24 37 L18 24 L29 24 Z"
              fill="#F2F5F8" stroke="#0b1626" stroke-width="2"/>
      </svg>
      <div class="endlab" id="endlab">WHEN IT MESSES UP — I GO IN AND FIX IT</div>
    </div>
    <div class="grain"></div>
    <div class="vignette"></div>
  </div>

  <script src="assets/gsap.min.js"></script>
  <script>
  (() => {
    const DUR = 12;
    const WIDTHS = [70,52,64,48,66,58,72,50,62,56,68,54]; // sums to 720
    const grpSrc = document.getElementById('grpSrc');
    const grpLeft = document.getElementById('grpLeft');
    const grpRight = document.getElementById('grpRight');
    const slab = document.getElementById('slab');

    const fusedX = []; let acc = 0;
    WIDTHS.forEach(w => { fusedX.push(acc); acc += w; });

    const mkSegs = (host, withHandles) => WIDTHS.map((w, i) => {
      const s = document.createElement('div');
      s.className = 'seg';
      s.style.cssText = `left:${fusedX[i]}px; width:${w}px;`;
      if (withHandles) s.innerHTML = '<div class="hdl l"></div><div class="hdl r"></div>';
      host.appendChild(s);
      return s;
    });
    const srcSegs = mkSegs(grpSrc, false);
    const leftSegs = mkSegs(grpLeft, false);
    grpLeft.appendChild(slab); // slab overlays the left segs
    const rightSegs = mkSegs(grpRight, true);
    const handles = [...grpRight.querySelectorAll('.hdl')];

    const spread = i => (i - 5.5) * 5;     // thin visible seams
    const explode = i => (i - 5.5) * 13;   // pulled-apart clips
    const jitter = i => (i % 2 ? 7 : -7);

    // the SAME bad cut on both copies — a frame skip at the seg6/seg7 seam
    const bandL = document.createElement('div');
    bandL.className = 'badcut';
    bandL.style.cssText = `left:${fusedX[7] - 5}px; top:-6px; height:162px;`;
    grpLeft.appendChild(bandL); // above the slab
    const bandR = document.createElement('div');
    bandR.className = 'badcut';
    bandR.style.cssText = `left:${fusedX[7] + explode(7) - 7}px; top:-12px; height:174px;`;
    grpRight.appendChild(bandR);

    const tl = gsap.timeline({ paused: true });
    // hidden / offset states at t=0 (seek-safe)
    tl.set('#kicker', { opacity: 0, y: 14 }, 0);
    tl.set(['#titleL', '#titleR', '#labL', '#labR', '#endlab'], { opacity: 0 }, 0);
    srcSegs.forEach((s, i) => tl.set(s, { x: spread(i), opacity: 0, y: 16 }, 0));
    tl.set(grpLeft, { x: 480, opacity: 0 }, 0);
    tl.set(grpRight, { x: -480, opacity: 0 }, 0);
    leftSegs.forEach((s, i) => tl.set(s, { x: spread(i) }, 0));
    rightSegs.forEach((s, i) => tl.set(s, { x: spread(i) }, 0));
    tl.set(slab, { opacity: 0 }, 0);
    tl.set('#gloss', { x: -200 }, 0);
    tl.set(handles, { opacity: 0 }, 0);
    tl.set([bandL, bandR], { opacity: 0 }, 0);
    tl.set('#cursor', { x: 1500, y: 1120, opacity: 0 }, 0);

    // AMBIENT — camera push, grid parallax, vignette breath (Law #4)
    tl.fromTo('#cam', { scale: 1 }, { scale: 1.014, duration: DUR, ease: 'none' }, 0);
    tl.to('.grid-tex', { backgroundPosition: '26px 18px, 18px 26px', duration: DUR, ease: 'none' }, 0);
    tl.to('.vignette', { opacity: 0.88, duration: DUR / 2, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 0);

    // one edit appears (seamed strip)
    tl.to('#kicker', { opacity: 1, y: 0, duration: 0.6, ease: 'expo.out' }, 0.25);
    srcSegs.forEach((s, i) =>
      tl.to(s, { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' }, 0.5 + i * 0.05));

    // hold, then THE SPLIT — one gesture, two fates
    tl.set(grpLeft, { opacity: 1 }, 1.95);
    tl.set(grpRight, { opacity: 1 }, 1.95);
    srcSegs.forEach(s => tl.set(s, { opacity: 0 }, 1.98));
    tl.to(grpLeft, { x: 0, duration: 0.85, ease: 'power2.inOut' }, 2.0);
    tl.to(grpRight, { x: 0, duration: 0.85, ease: 'power2.inOut' }, 2.0);
    tl.to(['#titleL', '#titleR'], { opacity: 1, duration: 0.55, ease: 'expo.out' }, 2.6);

    // LEFT fuses: seams melt, the slab seals it shut
    leftSegs.forEach(s => tl.to(s, { x: 0, duration: 0.6, ease: 'power2.inOut' }, 3.2));
    tl.to(slab, { opacity: 1, duration: 0.55, ease: 'power2.out' }, 3.55);
    tl.to('#gloss', { x: 900, duration: 0.7, ease: 'power2.inOut' }, 3.9);
    tl.to('#labL', { opacity: 1, duration: 0.45, ease: 'power2.out' }, 4.2);

    // RIGHT explodes into its clips: every handle visible
    rightSegs.forEach((s, i) =>
      tl.to(s, { x: explode(i), y: jitter(i), duration: 0.6, ease: 'power2.inOut' }, 4.7 + i * 0.02));
    tl.to(handles, { opacity: 0.85, duration: 0.4, ease: 'power2.out', stagger: 0.015 }, 5.25);
    tl.to('#labR', { opacity: 1, duration: 0.45, ease: 'power2.out' }, 5.55);

    // cursor: tries the slab — nothing to grab
    tl.to('#cursor', { opacity: 1, x: 470, y: 480, duration: 0.75, ease: 'power2.inOut' }, 5.9);
    tl.to('#cursor', { scale: 0.85, duration: 0.08, ease: 'power2.in' }, 6.65);
    tl.to('#cursor', { scale: 1, duration: 0.25, ease: 'power2.out' }, 6.75);
    tl.to('#labL', { color: '#c98a9a', duration: 0.25, yoyo: true, repeat: 1 }, 6.7);
    tl.to('#cursor', { x: 520, duration: 0.35, ease: 'power2.inOut' }, 7.05); // slides off

    // THE SAME BAD CUT flashes on both copies — a frame skip, same timestamp
    tl.fromTo(bandL, { opacity: 0 }, { opacity: 0.9, duration: 0.12, yoyo: true, repeat: 3 }, 7.35);
    tl.fromTo(bandR, { opacity: 0 }, { opacity: 0.9, duration: 0.12, yoyo: true, repeat: 2 }, 7.35);
    tl.to([rightSegs[6], rightSegs[7]], { x: '+=3', duration: 0.06, yoyo: true, repeat: 3 }, 7.35);

    // on the right you can FIX it: grab the clip edge, close the skip, the flash heals
    tl.to('#cursor', { x: 1080 + fusedX[7] + explode(7) - 2, y: 480, duration: 0.7,
      ease: 'power2.inOut' }, 7.95);
    tl.to('#cursor', { scale: 0.85, duration: 0.08, ease: 'power2.in' }, 8.7);
    tl.to(rightSegs[7], { x: explode(7) - 12, duration: 0.5, ease: 'power2.inOut' }, 8.8);
    tl.to(bandR, { x: -12, duration: 0.5, ease: 'power2.inOut' }, 8.8);
    tl.to('#cursor', { x: '-=12', duration: 0.5, ease: 'power2.inOut' }, 8.8);
    tl.to(bandR, { backgroundColor: '#F0A8C2', boxShadow: '0 0 14px rgba(240,168,194,.75)',
      duration: 0.3, ease: 'power2.out' }, 9.15);
    tl.to('#cursor', { scale: 1, duration: 0.2, ease: 'power2.out' }, 9.35);
    tl.to(bandR, { opacity: 0, duration: 0.5, ease: 'power2.out' }, 9.6);
    tl.to('#cursor', { opacity: 0, duration: 0.35, ease: 'power2.out' }, 9.8);

    // PUNCH — the editable side glows; the sealed side blinks red once more, still broken
    tl.to(rightSegs, { borderColor: '#F0A8C2', boxShadow: '0 0 22px rgba(240,168,194,.4)',
      duration: 0.5, ease: 'power2.out', stagger: 0.02 }, 10.05);
    tl.to('#endlab', { opacity: 1, duration: 0.5, ease: 'power2.out' }, 10.4);
    tl.fromTo(bandL, { opacity: 0 }, { opacity: 0.65, duration: 0.15, yoyo: true, repeat: 1 }, 10.7);

    // Law #11 anchor
    tl.to({}, { duration: DUR }, 0);
    window.__timelines = window.__timelines || {};
    window.__timelines['b0-twofates'] = tl;
  })();
  </script>
</div>
</body>
</html>
