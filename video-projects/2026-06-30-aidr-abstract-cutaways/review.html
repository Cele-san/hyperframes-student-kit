<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AIDR abstract cutaways — Gate 1 review</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body { background: #02060c; color: #F2F5F8; font-family: -apple-system, 'DM Sans', sans-serif; padding: 24px 28px 80px; }
  h1 { font-size: 18px; margin-bottom: 4px; }
  .sub { color: #5a7194; font-size: 13px; margin-bottom: 20px; }
  .part { margin-bottom: 36px; max-width: 1280px; }
  .part h2 { font-size: 14px; margin-bottom: 8px; color: #F0A8C2; font-family: 'JetBrains Mono', monospace; }
  .part h2 span { color: #5a7194; font-weight: 400; }
  .frame { position: relative; width: 100%; aspect-ratio: 16/9; border: 1px solid #1b2f52; border-radius: 8px; overflow: hidden; background: #050b13; }
  .frame iframe { position: absolute; top: 0; left: 0; width: 1920px; height: 1080px; border: 0; transform-origin: top left; }
  .ctl { display: flex; gap: 10px; align-items: center; margin-top: 8px; }
  .ctl button { background: #152848; color: #F2F5F8; border: 1px solid #2a4270; border-radius: 6px; padding: 5px 16px; font-size: 13px; font-weight: 600; cursor: pointer; }
  .ctl input[type=range] { flex: 1; accent-color: #F0A8C2; }
  .ctl .t { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #5a7194; width: 90px; text-align: right; }
</style>
</head>
<body>
<h1>AIDR abstract cutaways — Gate 1 review</h1>
<div class="sub">Six parts, real data, final register. Play each or scrub. These render at 1920×1080 · 29.97 for V2 placement.</div>
<div id="parts"></div>
<script>
const PARTS = [
  ['b0-twofates',  'fills the 0:53.4 gap · "the viral version gives you an mp4… mine cuts inside the actual timeline"', 12],
  ['b3-wordrain',  '~3:17.7 intercut · "transcribes it down to the timestamp, word by word" (real C2288 words)', 8],
  ['b3-cutter',    '~3:39.3 · "you give it two things… cuts out the bad takes" (real debris classes)', 14],
  ['b3-tower',     'lead-in to the 4:03.5 timeline shot · "85 to 90 percent of the first cut" (real runtime math)', 9],
  ['b5-relay',     '~5:16 · "a junior editor in your pocket"', 10],
  ['b7-asymptote', '~7:25 · "80 percent of the way there… only hits 100 if you stop evolving"', 8],
];
const host = document.getElementById('parts');
PARTS.forEach(([id, note, dur]) => {
  const d = document.createElement('div');
  d.className = 'part';
  d.innerHTML = `
    <h2>${id} <span>— ${note}</span></h2>
    <div class="frame"><iframe src="parts/${id}/" scrolling="no"></iframe></div>
    <div class="ctl">
      <button data-act="play">▶ play</button>
      <button data-act="restart">⟲ restart</button>
      <input type="range" min="0" max="${dur}" step="0.01" value="0">
      <div class="t">0.00 / ${dur.toFixed(2)}s</div>
    </div>`;
  host.appendChild(d);
  const iframe = d.querySelector('iframe');
  const range = d.querySelector('input');
  const tdisp = d.querySelector('.t');
  const scale = () => { iframe.style.transform = `scale(${d.querySelector('.frame').clientWidth / 1920})`; };
  scale(); window.addEventListener('resize', scale);
  const tl = () => iframe.contentWindow && iframe.contentWindow.__timelines
    && iframe.contentWindow.__timelines[id];
  let raf;
  const track = () => { const t = tl(); if (t) { range.value = t.time();
    tdisp.textContent = t.time().toFixed(2) + ' / ' + dur.toFixed(2) + 's'; }
    raf = requestAnimationFrame(track); };
  track();
  d.querySelector('[data-act=play]').onclick = () => { const t = tl(); if (!t) return;
    t.paused() || t.time() >= dur - 0.01 ? (t.time() >= dur - 0.01 && t.seek(0), t.play()) : t.pause(); };
  d.querySelector('[data-act=restart]').onclick = () => { const t = tl(); if (t) t.seek(0).play(); };
  range.oninput = () => { const t = tl(); if (t) { t.pause(); t.seek(parseFloat(range.value), false); } };
});
</script>
</body>
</html>
