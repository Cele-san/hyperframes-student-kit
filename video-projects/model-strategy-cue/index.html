<!doctype html>
<!--
  model-strategy-cue — PRODUCTION. Beat 5 Form-1 two-model-rule cue, Quiet Register v4.
  TRANSPARENT alpha canvas -> renders to .mov for Resolve V2 over Andy A-roll (~3:15-4:45 window).
  FALLBACK insurance: pins the two-model rule if Andy's spoken read lands flat.
  Two mono lines, aligned columns:  OPUS -> plan  /  SONNET 5 -> execute.
  Model names bright ink (500); arrows + verbs .dim. ALL-NEUTRAL — no red/green/cyan/blossom.
  Emphasis = brightness contrast only (Law: color/dim, never motion spectacle).
  Reveal beats are placeholders re-timed at the Thu cut. ~8s baked (enter / hold / exit).
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: 'Geist Mono'; font-weight: 400; font-display: block; src: url(assets/fonts/GeistMono-400.woff2) format('woff2'); }
  @font-face { font-family: 'Geist Mono'; font-weight: 500; font-display: block; src: url(assets/fonts/GeistMono-500.woff2) format('woff2'); }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1920px; height:1080px; overflow:hidden; background:transparent; font-family:'Geist Mono',monospace; }
  #stage { position:relative; width:1920px; height:1080px; }

  /* lower-third band, left-anchored — matches cost-stakes-cue + card system */
  #cue { position:absolute; left:120px; bottom:150px; }

  .rule-row {
    display:grid;
    grid-template-columns: 220px 60px auto;  /* name | arrow | verb — aligned columns */
    align-items:baseline;
    opacity:0;                                /* container fade handled by GSAP on #cue */
    height:58px;
  }
  .name {
    font-weight:500; font-size:34px; letter-spacing:0.04em;
    color:#8995b0;                            /* starts dim; brightens to ink on entrance-complete */
    text-shadow:0 2px 18px rgba(0,0,0,0.65);
    white-space:nowrap;
  }
  .arrow {
    font-weight:400; font-size:30px; letter-spacing:0.04em;
    color:#8995b0;                            /* .dim — the mapping, not the payload */
    text-shadow:0 2px 18px rgba(0,0,0,0.65);
  }
  .verb {
    font-weight:400; font-size:30px; letter-spacing:0.04em;
    color:#8995b0;                            /* .dim — the job label stays quiet */
    text-shadow:0 2px 18px rgba(0,0,0,0.65);
    white-space:nowrap;
  }
</style>
</head>
<body data-hf-duration="8">
  <div id="stage" data-composition-id="model-strategy-cue" data-width="1920" data-height="1080" data-start="0" data-duration="8" data-track-index="1">
    <div id="cue" class="clip" data-start="0" data-duration="8" data-track-index="2">
      <div class="rule-row" id="row-opus">
        <span class="name" id="name-opus">OPUS</span>
        <span class="arrow">&#8594;</span>
        <span class="verb">plan</span>
      </div>
      <div class="rule-row" id="row-sonnet" style="margin-top:22px;">
        <span class="name" id="name-sonnet">SONNET 5</span>
        <span class="arrow">&#8594;</span>
        <span class="verb">execute</span>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script>
    const tl = gsap.timeline({ paused: true });
    tl.to({}, { duration: 8 }, 0); // slot anchor — tl.duration() === cue length

    // Entrance — both lines fade up together (one fact, not a list). Slow opacity >=1s, Law #10 blur clears.
    tl.set('#row-opus',   { opacity: 1 }, 0);   // rows visible via container; per-row opacity used for blur pass
    tl.set('#row-sonnet', { opacity: 1 }, 0);
    tl.fromTo('#cue',
      { opacity: 0, y: 14, filter: 'blur(6px)' },
      { opacity: 1, y: 0, filter: 'blur(0px)', duration: 1.1, ease: 'power2.out' }, 0.5);

    // Emphasis — model names brighten to full ink on entrance-complete (single 0.4s brightness step).
    tl.to(['#name-opus', '#name-sonnet'],
      { color: '#e9edf6', duration: 0.4, ease: 'power2.out' }, 1.7);

    // Hold — sharp and still (no motion through the middle).

    // Exit — single opacity fade <=1s, out before the beat's next sentence.
    tl.to('#cue', { opacity: 0, duration: 0.9, ease: 'power2.in' }, 6.7);

    window.__timelines = window.__timelines || {};
    window.__timelines['model-strategy-cue'] = tl;
  </script>
</body>
</html>
