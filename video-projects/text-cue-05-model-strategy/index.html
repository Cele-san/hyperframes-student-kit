<!doctype html>
<!--
  text-cue-05-model-strategy — Form-1 staged two-part cue, Quiet Register v4. Beat 5 setup hold.
  TRANSPARENT alpha -> .mov for Resolve (~6:31.8-6:55). Two-model rule: OPUS to plan, SONNET 5 to save.
  Staged reveal; a hair-thin cyan connector (#7ea4d8) draws between the two phases. NO blossom here.
  Placement: upper-left scrim x480 y300 (clear in both zoom states). "Fable 2" caveat stays VO-only.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: 'Geist Mono'; font-weight: 400; font-display: block; src: url(assets/fonts/GeistMono-400.woff2) format('woff2'); }
  @font-face { font-family: 'Geist Mono'; font-weight: 500; font-display: block; src: url(assets/fonts/GeistMono-500.woff2) format('woff2'); }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1920px; height:1080px; overflow:hidden; background:transparent; font-family:'Geist Mono',monospace; }
  #stage { position:relative; width:1920px; height:1080px; }

  #cue { position:absolute; left:480px; top:300px; }
  .scrim { display:inline-block; background:rgba(8,14,24,0.82); border-radius:10px;
           padding:30px 36px; box-shadow:0 12px 40px rgba(0,0,0,0.4); opacity:0; }
  .line { font-size:32px; letter-spacing:0.04em; white-space:nowrap;
          text-shadow:0 2px 18px rgba(0,0,0,0.65); }
  .model { color:#e9edf6; font-weight:500; }
  #m2 { color:#8995b0; }
  .arw { color:#8995b0; font-weight:400; }
  .conn { width:56px; height:2px; background:#7ea4d8; margin:12px 0 12px 2px; }
  #l2 { opacity:0; }
</style>
</head>
<body data-hf-duration="23">
  <div id="stage" data-composition-id="text-cue-05-model-strategy" data-width="1920" data-height="1080" data-start="0" data-duration="23" data-track-index="1">
    <div id="cue" class="clip" data-start="0" data-duration="23" data-track-index="2">
      <div class="scrim">
        <div class="line" id="l1"><span class="model">OPUS</span><span class="arw"> &rarr; plan &amp; brainstorm</span></div>
        <div class="conn" id="conn"></div>
        <div class="line" id="l2"><span class="model" id="m2">SONNET 5</span><span class="arw"> &rarr; save tokens</span></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script>
    const tl = gsap.timeline({ paused: true });
    tl.to({}, { duration: 23 }, 0); // slot anchor

    // Entrance with L1 (phase 1).
    tl.fromTo('.scrim', { opacity: 0, filter: 'blur(6px)' },
                        { opacity: 1, filter: 'blur(0px)', duration: 0.5, ease: 'power2.out' }, 4.0);

    // Cyan connector draws between the two phases.
    tl.fromTo('#conn', { scaleX: 0, transformOrigin: 'left center' },
                       { scaleX: 1, duration: 0.45, ease: 'power2.inOut' }, 7.5);

    // L2 staged reveal (phase 2), then weight/emphasis brighten on the model name.
    tl.fromTo('#l2', { opacity: 0, y: 10, filter: 'blur(4px)' },
                     { opacity: 1, y: 0, filter: 'blur(0px)', duration: 0.5, ease: 'power2.out' }, 9.0);
    tl.to('#m2', { color: '#e9edf6', duration: 0.4, ease: 'power2.out' }, 9.5);

    // Hold through the VO caveat, then exit — whole-cue opacity fade.
    tl.to('.scrim', { opacity: 0, duration: 1.0, ease: 'power2.in' }, 22.0);

    window.__timelines = window.__timelines || {};
    window.__timelines['text-cue-05-model-strategy'] = tl;
  </script>
</body>
</html>
