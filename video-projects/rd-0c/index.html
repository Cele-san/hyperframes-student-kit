<!doctype html>
<!-- rd-0c — FLOATING LABEL, cue-0c-assistant-deal (10.5s, full-frame A-roll, x120 y790).
     3 staged lines; L3 "you still have the final call" brightens to ink. Backglow + drift. -->
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family:'Geist Mono'; font-weight:400; font-display:block; src:url(assets/fonts/GeistMono-400.woff2) format('woff2'); }
  @font-face { font-family:'Geist Mono'; font-weight:500; font-display:block; src:url(assets/fonts/GeistMono-500.woff2) format('woff2'); }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1920px; height:1080px; overflow:hidden; background:transparent; font-family:'Geist Mono',monospace; }
  #stage { position:relative; width:1920px; height:1080px; }
  #vig { position:absolute; left:-240px; top:-160px; width:1400px; height:520px; opacity:0;
         background:radial-gradient(ellipse 60% 54% at 42% 48%, rgba(5,9,17,0.64) 0%, rgba(5,9,17,0.4) 52%, rgba(5,9,17,0) 76%); }
  #cue { position:absolute; left:120px; top:790px; }
  .line { font-size:34px; letter-spacing:0.03em; white-space:nowrap; font-weight:400; color:#8995b0;
          text-shadow:0 2px 12px rgba(0,0,0,0.92), 0 0 44px rgba(0,0,0,0.6); opacity:0; margin-top:14px; }
  #l1 { margin-top:0; font-weight:500; }
  #l3 { font-weight:500; }
</style>
</head>
<body data-hf-duration="10.5">
  <div id="stage" data-composition-id="rd-0c" data-width="1920" data-height="1080" data-start="0" data-duration="10.5" data-track-index="1">
    <div id="cue" class="clip" data-start="0" data-duration="10.5" data-track-index="2">
      <div id="vig"></div>
      <div id="txt">
        <div class="line" id="l1">an editing assistant</div>
        <div class="line" id="l2">first pass &middot; assembly &middot; cuts &middot; timeline</div>
        <div class="line" id="l3">you still have the final call</div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script>
    const tl = gsap.timeline({ paused: true });
    tl.to({}, { duration: 10.5 }, 0);
    tl.to('#vig', { opacity: 1, duration: 0.9, ease: 'power2.out' }, 0.3);
    tl.to('#vig', { opacity: 0, duration: 0.6, ease: 'power2.in' }, 9.5);
    tl.fromTo('#txt', { x: 0 }, { x: 10, duration: 9.2, ease: 'none' }, 0.6);
    const slide = (sel, at) => tl.fromTo(sel, { opacity:0, x:-24, filter:'blur(5px)' },
      { opacity:1, x:0, filter:'blur(0px)', duration:0.25, ease:'power2.out' }, at);
    slide('#l1', 0.6);
    slide('#l2', 3.0);
    slide('#l3', 8.2);
    tl.to('#l3', { color:'#e9edf6', duration:0.4, ease:'power2.out' }, 8.6);
    tl.to('#cue', { opacity:0, duration:0.6, ease:'power2.in' }, 9.7);
    window.__timelines = window.__timelines || {};
    window.__timelines['rd-0c'] = tl;
  </script>
</body>
</html>
