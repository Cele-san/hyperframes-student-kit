<!doctype html>
<!-- rd-big-07 — BIG TYPE neutral variant, cue-07-still-have-job (7.5s, x120 y820).
     BINDING: flat ink only, NO blossom, NO green, softened punch (scale 1.03) — reassurance,
     not celebration. Words pop on the spoken VO times; slow underline; gentle fade exit
     (hard cut would read aggressive here). -->
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family:'Geist Mono'; font-weight:400; font-display:block; src:url(assets/fonts/GeistMono-400.woff2) format('woff2'); }
  @font-face { font-family:'Geist Mono'; font-weight:500; font-display:block; src:url(assets/fonts/GeistMono-500.woff2) format('woff2'); }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1920px; height:1080px; overflow:hidden; background:transparent; font-family:'Geist Mono',monospace; }
  #stage { position:relative; width:1920px; height:1080px; }
  #wash { position:absolute; left:-280px; top:-160px; width:1450px; height:460px; opacity:0;
          background:radial-gradient(ellipse 58% 54% at 42% 50%, rgba(5,9,17,0.62) 0%, rgba(5,9,17,0.4) 52%, rgba(5,9,17,0) 76%); }
  #cue { position:absolute; left:120px; top:820px; }
  #linewrap { position:relative; display:inline-block; }
  .kicker { display:flex; gap:20px; }
  .w { display:inline-block; font-weight:500; font-size:72px; letter-spacing:0; color:#e9edf6;
       opacity:0; transform-origin:left bottom;
       text-shadow:0 3px 12px rgba(0,0,0,0.92), 0 0 54px rgba(0,0,0,0.6); }
  #uline { position:absolute; left:0; right:0; bottom:-12px; height:3px; background:#e9edf6;
           opacity:0.8; transform:scaleX(0); transform-origin:left center; }
</style>
</head>
<body data-hf-duration="7.5">
  <div id="stage" data-composition-id="rd-big-07" data-width="1920" data-height="1080" data-start="0" data-duration="7.5" data-track-index="1">
    <div id="cue" class="clip" data-start="0" data-duration="7.5" data-track-index="2">
      <div id="wash"></div>
      <span id="linewrap">
        <span class="kicker">
          <span class="w" id="w1">you</span>
          <span class="w" id="w2">still</span>
          <span class="w" id="w3">have</span>
          <span class="w" id="w4">your</span>
          <span class="w" id="w5">job</span>
        </span>
        <span id="uline"></span>
      </span>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script>
    const tl = gsap.timeline({ paused: true });
    tl.to({}, { duration: 7.5 }, 0);
    tl.to('#wash', { opacity: 1, duration: 0.6, ease: 'power2.out' }, 2.2);
    // softened pops (1.03, slightly slower) on the spoken word times — VO 931.5-934.0, IN 929.0
    const pop = (sel, at) => tl.fromTo(sel, { opacity:0, scale:1.03, y:4, filter:'blur(3px)' },
      { opacity:1, scale:1, y:0, filter:'blur(0px)', duration:0.18, ease:'power2.out' }, at);
    pop('#w1', 2.50); pop('#w2', 2.78); pop('#w3', 3.06); pop('#w4', 3.30); pop('#w5', 3.55);
    // slow reassurance underline — ink, not celebratory
    tl.fromTo('#uline', { scaleX: 0 }, { scaleX: 1, duration: 0.9, ease: 'power2.inOut' }, 4.2);
    tl.fromTo('#cue', { x: 0 }, { x: 6, duration: 4.4, ease: 'none' }, 2.5);
    // gentle fade exit (binding: not celebratory, not aggressive)
    tl.to('#cue', { opacity: 0, duration: 0.9, ease: 'power2.in' }, 6.5);
    window.__timelines = window.__timelines || {};
    window.__timelines['rd-big-07'] = tl;
  </script>
</body>
</html>
