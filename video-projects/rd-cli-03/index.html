<!doctype html>
<!-- rd-cli-03 — CLI-NATIVE, cue-03-install-steps (15s, x300 y600). Lever 3: live checklist —
     each step enters as cyan › then flips to a cyan ✓ + brightens when the VO completes it.
     Backglow + drift + quick collapse exit. -->
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family:'Geist Mono'; font-weight:400; font-display:block; src:url(assets/fonts/GeistMono-400.woff2) format('woff2'); }
  @font-face { font-family:'Geist Mono'; font-weight:500; font-display:block; src:url(assets/fonts/GeistMono-500.woff2) format('woff2'); }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1920px; height:1080px; overflow:hidden; background:transparent; font-family:'Geist Mono',monospace; }
  #stage { position:relative; width:1920px; height:1080px; }
  #vig { position:absolute; left:-260px; top:-180px; width:1250px; height:640px; opacity:0;
         background:radial-gradient(ellipse 62% 55% at 42% 48%, rgba(5,9,17,0.66) 0%, rgba(5,9,17,0.42) 52%, rgba(5,9,17,0) 76%); }
  #cue { position:absolute; left:300px; top:600px; }
  .step { position:relative; font-size:36px; letter-spacing:0.02em; white-space:nowrap; color:#8995b0;
          font-weight:400; opacity:0; margin-top:22px;
          text-shadow:0 2px 10px rgba(0,0,0,0.9), 0 0 40px rgba(0,0,0,0.6); }
  #s1 { margin-top:0; }
  .glyph { display:inline-block; width:46px; color:#5BA8D8; font-weight:500; }
  .glyph .g-arrow { display:inline-block; }
  .glyph .g-check { display:inline-block; position:absolute; left:0; opacity:0; }
</style>
</head>
<body data-hf-duration="15">
  <div id="stage" data-composition-id="rd-cli-03" data-width="1920" data-height="1080" data-start="0" data-duration="15" data-track-index="1">
    <div id="cue" class="clip" data-start="0" data-duration="15" data-track-index="2">
      <div id="vig"></div>
      <div id="txt">
        <div class="step" id="s1"><span class="glyph"><span class="g-arrow">&rsaquo;</span><span class="g-check">&#10003;</span></span>clone</div>
        <div class="step" id="s2"><span class="glyph"><span class="g-arrow">&rsaquo;</span><span class="g-check">&#10003;</span></span>isolated venv</div>
        <div class="step" id="s3"><span class="glyph"><span class="g-arrow">&rsaquo;</span><span class="g-check">&#10003;</span></span>wire it up</div>
        <div class="step" id="s4"><span class="glyph"><span class="g-arrow">&rsaquo;</span><span class="g-check">&#10003;</span></span>verify</div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script>
    const tl = gsap.timeline({ paused: true });
    tl.to({}, { duration: 15 }, 0);
    tl.to('#vig', { opacity: 1, duration: 0.8, ease: 'power2.out' }, 2.6);
    tl.to('#vig', { opacity: 0, duration: 0.5, ease: 'power2.in' }, 14.2);
    tl.fromTo('#txt', { x: 0 }, { x: 10, duration: 11.6, ease: 'none' }, 2.8);

    const enter = (sel, at) => tl.fromTo(sel, { opacity:0, y:6 },
      { opacity:1, y:0, duration:0.15, ease:'power2.out' }, at);
    // step completes: › flips to ✓, text brightens to ink
    const done = (sel, at) => {
      tl.to(sel + ' .g-arrow', { opacity:0, duration:0.08 }, at);
      tl.to(sel + ' .g-check', { opacity:1, duration:0.08 }, at + 0.04);
      tl.to(sel, { color:'#e9edf6', duration:0.3, ease:'power2.out' }, at);
    };
    enter('#s1', 3.0);   done('#s1', 4.6);
    enter('#s2', 4.8);   done('#s2', 7.3);
    enter('#s3', 7.5);   done('#s3', 13.3);
    enter('#s4', 13.6);  done('#s4', 14.1);

    tl.to('#cue', { opacity:0, y:-14, duration:0.4, ease:'power2.in' }, 14.55);
    window.__timelines = window.__timelines || {};
    window.__timelines['rd-cli-03'] = tl;
  </script>
</body>
</html>
