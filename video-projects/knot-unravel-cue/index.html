<!doctype html>
<!--
  knot-unravel-cue — PRODUCTION v2 (rework per dispatcher review). Beat 11 Form-1 close cue, Quiet Register v4.
  TRANSPARENT alpha canvas -> renders to .mov for Resolve V2 over seg4.1f (~10:45-11:15).
  Andy's lived metaphor given a body: "unravel it one knot at a time."
  v2 changes vs v1: (1) every loop SELF-CROSSES (crossed-control cubics — the line goes over itself,
  cursive/pretzel, not tangent teardrops); (2) each pull is a 2-STEP crossfade through a hand-authored
  "half-pulled" intermediate (loop shrunk+flattened, remaining loops shifted/grown, freed slack extends
  the line's right end 1180 -> ... -> 1320) so it reads as unraveling, not deletion; (3) loops varied —
  LARGE / medium / small, unevenly spaced, resolved largest-first; (4) caption tightened up near the line.
  States remain pre-authored <path> siblings crossfaded by opacity (NO MorphSVG — determinism),
  only one visible at a time. Cyan line #7ea4d8; ink start dot #e9edf6; ONE blossom landing dot
  #F0A8C2 on the final straight state only. No red/green. Caption 'one knot at a time' verbatim
  (seg4.1f @0:56), dim. ~12s. MUST be OUT before cta-endcard IN. Pull timings placeholders (Thu cut).
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: 'Geist Mono'; font-weight: 400; font-display: block; src: url(assets/fonts/GeistMono-400.woff2) format('woff2'); }
  @font-face { font-family: 'Geist Mono'; font-weight: 500; font-display: block; src: url(assets/fonts/GeistMono-500.woff2) format('woff2'); }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1920px; height:1080px; overflow:hidden; background:transparent; font-family:'Geist Mono',monospace; }
  #stage { position:relative; width:1920px; height:1080px; }

  /* upper-third band, centered-left — leaves the lower third clear for the cta-endcard handoff */
  #cue { position:absolute; left:0; top:0; width:1920px; height:1080px; }

  #knot { position:absolute; left:0; top:0; }
  .state { fill:none; stroke:#7ea4d8; stroke-width:2.5px; stroke-linecap:round; stroke-linejoin:round; }
  #s0h, #s1, #s1h, #s2, #s2h, #s3 { opacity:0; }   /* only the tangle (#s0) enters, via draw-on */

  /* caption — dim, no headline; left-aligned to the start dot, tight under the line */
  #caption {
    position:absolute; left:520px; top:338px;
    font-weight:400; font-size:26px; letter-spacing:0.04em;
    color:#8995b0;
    text-shadow:0 2px 18px rgba(0,0,0,0.65);
    opacity:0;
  }
</style>
</head>
<body data-hf-duration="12">
  <div id="stage" data-composition-id="knot-unravel-cue" data-width="1920" data-height="1080" data-start="0" data-duration="12" data-track-index="1">
    <div id="cue" class="clip" data-start="0" data-duration="12" data-track-index="2">
      <svg id="knot" width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
        <!--
          Loop grammar: a self-crossing cursive loop from A=(x1,300) to B=(x2,300) uses CROSSED
          control points  C (x2+e),(300-h)  (x1-e),(300-h)  x2,300  — the descending strand
          crosses the ascending strand, so the line visibly goes OVER ITSELF at every knot.
          Slack law: each released loop's length feeds the right end (1180 -> 1205 -> 1230 ->
          1255 -> 1280 -> 1300 -> 1320) and the surviving loops drift right / grow slightly.
          Resolve order: LARGEST first (L -> M -> S).
        -->
        <!-- s0 — full tangle: LARGE + medium + small self-crossing loops, unevenly spaced -->
        <path id="s0" class="state" pathLength="1000"
          d="M 520,300
             L 640,300 C 790,130 550,130 700,300
             L 900,300 C 1010,185 845,185 945,300
             L 1060,300 C 1140,230 1015,230 1095,300
             L 1180,300" />
        <!-- s0h — pull 1 in progress: L loop half-pulled (shrunk + flattened), M/S drift right + grow, slack out to 1205 -->
        <path id="s0h" class="state"
          d="M 520,300
             L 648,300 C 738,225 602,225 692,300
             L 915,300 C 1028,180 858,180 960,300
             L 1075,300 C 1156,228 1029,228 1110,300
             L 1205,300" />
        <!-- s1 — L released: 2 loops remain (grown a touch), slack out to 1230 -->
        <path id="s1" class="state"
          d="M 520,300
             L 930,300 C 1048,172 872,172 975,300
             L 1090,300 C 1172,226 1043,226 1125,300
             L 1230,300" />
        <!-- s1h — pull 2 in progress: M half-pulled, S drifts right + grows, slack out to 1255 -->
        <path id="s1h" class="state"
          d="M 520,300
             L 936,300 C 1005,240 901,240 970,300
             L 1105,300 C 1190,222 1055,222 1140,300
             L 1255,300" />
        <!-- s2 — M released: 1 loop remains (S, slightly grown), slack out to 1280 -->
        <path id="s2" class="state"
          d="M 520,300
             L 1118,300 C 1208,214 1065,214 1155,300
             L 1280,300" />
        <!-- s2h — pull 3 in progress: S half-pulled, slack out to 1300 -->
        <path id="s2h" class="state"
          d="M 520,300
             L 1124,300 C 1174,258 1099,258 1149,300
             L 1300,300" />
        <!-- s3 — straight, resolved, full span -->
        <path id="s3" class="state"
          d="M 520,300 L 1320,300" />
        <!-- start dot (ink) — the held end you pull from -->
        <circle id="start-dot" cx="520" cy="300" r="7" fill="#e9edf6" opacity="0" />
        <!-- landing dot (blossom) — the ONLY blossom element; grows in on the resolved end -->
        <circle id="land-dot" cx="1320" cy="300" r="0" fill="#F0A8C2" opacity="0" />
      </svg>
      <div id="caption">one knot at a time</div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script>
    const tl = gsap.timeline({ paused: true });
    tl.to({}, { duration: 12 }, 0); // slot anchor — tl.duration() === cue length

    // Entrance — the tangle draws on (stroke-dashoffset), start dot fades in at completion.
    tl.set('#s0', { strokeDasharray: 1000, strokeDashoffset: 1000 }, 0);
    tl.to('#s0', { strokeDashoffset: 0, duration: 1.2, ease: 'power2.inOut' }, 0.5);
    tl.fromTo('#start-dot', { opacity: 0 }, { opacity: 1, duration: 0.35, ease: 'power2.out' }, 1.5);

    // Caption fades up dim with the first pull; stays dim throughout.
    tl.fromTo('#caption', { opacity: 0, y: 8, filter: 'blur(4px)' },
                          { opacity: 1, y: 0, filter: 'blur(0px)', duration: 0.6, ease: 'power2.out' }, 3.0);

    // --- The pulls: 2-step crossfades through the half-pulled intermediates (Law #10 blur on outgoing).
    // Each pull: full -> half-pulled (0.3s), half-pulled -> released (0.35s) — the loop shrinks
    // through the line and the freed slack extends the right end; not a pop-off.

    // Pull 1 — LARGE loop
    tl.to('#s0',      { opacity: 0, filter: 'blur(4px)', duration: 0.3, ease: 'power2.out' }, 3.0);
    tl.fromTo('#s0h', { opacity: 0, filter: 'blur(4px)' },
                      { opacity: 1, filter: 'blur(0px)', duration: 0.3, ease: 'power2.out' }, 3.0);
    tl.to('#s0h',     { opacity: 0, filter: 'blur(4px)', duration: 0.35, ease: 'power2.out' }, 3.35);
    tl.fromTo('#s1',  { opacity: 0, filter: 'blur(4px)' },
                      { opacity: 1, filter: 'blur(0px)', duration: 0.35, ease: 'power2.out' }, 3.35);

    // Pull 2 — medium loop
    tl.to('#s1',      { opacity: 0, filter: 'blur(4px)', duration: 0.3, ease: 'power2.out' }, 5.0);
    tl.fromTo('#s1h', { opacity: 0, filter: 'blur(4px)' },
                      { opacity: 1, filter: 'blur(0px)', duration: 0.3, ease: 'power2.out' }, 5.0);
    tl.to('#s1h',     { opacity: 0, filter: 'blur(4px)', duration: 0.35, ease: 'power2.out' }, 5.35);
    tl.fromTo('#s2',  { opacity: 0, filter: 'blur(4px)' },
                      { opacity: 1, filter: 'blur(0px)', duration: 0.35, ease: 'power2.out' }, 5.35);

    // Pull 3 — small loop, lands straight
    tl.to('#s2',      { opacity: 0, filter: 'blur(4px)', duration: 0.3, ease: 'power2.out' }, 7.0);
    tl.fromTo('#s2h', { opacity: 0, filter: 'blur(4px)' },
                      { opacity: 1, filter: 'blur(0px)', duration: 0.3, ease: 'power2.out' }, 7.0);
    tl.to('#s2h',     { opacity: 0, filter: 'blur(4px)', duration: 0.35, ease: 'power2.out' }, 7.35);
    tl.fromTo('#s3',  { opacity: 0, filter: 'blur(4px)' },
                      { opacity: 1, filter: 'blur(0px)', duration: 0.35, ease: 'power2.out' }, 7.35);

    // Landing — the blossom endpoint dot grows in (radius attr, no transform) on the resolved line.
    tl.fromTo('#land-dot', { attr: { r: 0 }, opacity: 0 },
                           { attr: { r: 7 }, opacity: 1, duration: 0.3, ease: 'power2.out' }, 7.9);

    // Hold the resolved state, then exit — single opacity fade <=1s, OUT before the cta-endcard IN.
    tl.to('#cue', { opacity: 0, duration: 1.0, ease: 'power2.in' }, 10.6);

    window.__timelines = window.__timelines || {};
    window.__timelines['knot-unravel-cue'] = tl;
  </script>
</body>
</html>
