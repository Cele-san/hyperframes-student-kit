<!doctype html>
<!--
  resolve-pipeline-diagram — Beat 7 Form-2 diagram (Quiet Register). OPAQUE full-frame mp4,
  own navy background (standalone pre-make form). Trust shape, NOT a pipeline:
  footage + script -> reads it as text (WhisperX, cyan) -> cut to script (blossom, 29.97).
  Only earned labels: WhisperX + 29.97. align/import/analyze stay in VO. No red, no green, no loop.
  ~15s: build ~6s L->R (nodes + cyan draw-on connectors) -> hold -> gentle fade.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family:'Geist'; font-weight:400; font-display:block; src:url(assets/fonts/Geist-400.woff2) format('woff2'); }
  @font-face { font-family:'Geist'; font-weight:500; font-display:block; src:url(assets/fonts/Geist-500.woff2) format('woff2'); }
  @font-face { font-family:'Geist'; font-weight:600; font-display:block; src:url(assets/fonts/Geist-600.woff2) format('woff2'); }
  @font-face { font-family:'Geist Mono'; font-weight:400; font-display:block; src:url(assets/fonts/GeistMono-400.woff2) format('woff2'); }
  @font-face { font-family:'Geist Mono'; font-weight:500; font-display:block; src:url(assets/fonts/GeistMono-500.woff2) format('woff2'); }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1920px; height:1080px; overflow:hidden;
               background:radial-gradient(ellipse 1400px 900px at 960px 500px, #0d1b30 0%, #0A1628 72%);
               font-family:'Geist',sans-serif; }
  #stage { position:relative; width:1920px; height:1080px; }

  #eyebrow { position:absolute; left:170px; top:210px; font-family:'Geist Mono',monospace;
             font-weight:500; font-size:22px; letter-spacing:0.24em; text-transform:uppercase;
             color:#7C93B4; opacity:0; }

  .node { position:absolute; top:440px; width:400px; min-height:180px; padding:34px 34px;
          background:#14243C; border:1px solid #223A5C; border-radius:14px; opacity:0;
          display:flex; flex-direction:column; justify-content:center; }
  #n1 { left:170px; }
  #n2 { left:760px; border-color:#2f4d70; }
  #n3 { left:1350px; }
  .node .k { font-family:'Geist Mono',monospace; font-weight:500; font-size:16px; letter-spacing:0.16em;
             text-transform:uppercase; color:#7C93B4; margin-bottom:12px; }
  .node .h { font-family:'Geist',sans-serif; font-weight:600; font-size:32px; letter-spacing:-0.01em; color:#EAF2FF; line-height:1.15; }
  .node .tag { display:inline-block; margin-top:16px; font-family:'Geist Mono',monospace; font-weight:500;
               font-size:20px; letter-spacing:0.02em; padding:6px 12px; border-radius:8px; }
  #n2 .tag { color:#5BA8D8; border:1px solid #2f5a7a; background:rgba(91,168,216,0.08); }  /* cyan = secondary/data */
  #n3 .tag { color:#7C93B4; border:1px solid #223A5C; background:rgba(34,58,92,0.25); }     /* neutral spec tag — blossom stays on the heading only */
  #n2 .h .accent { color:#5BA8D8; }
  #n3 .h .accent { color:#F0A8C2; }  /* blossom = the landing */

  svg#wires { position:absolute; inset:0; overflow:visible; }
  svg#wires path { fill:none; stroke:#7ea4d8; stroke-width:2.5; stroke-linecap:round; }
</style>
</head>
<body data-hf-duration="15">
  <div id="stage" data-composition-id="resolve-pipeline-diagram" data-width="1920" data-height="1080" data-start="0" data-duration="15" data-track-index="1">
    <div id="eyebrow" class="clip" data-start="0" data-duration="15" data-track-index="2">HOW IT WORKS</div>

    <svg id="wires" class="clip" data-start="0" data-duration="15" data-track-index="3" width="1920" height="1080" viewBox="0 0 1920 1080">
      <path id="w1" d="M 570 530 C 640 530, 690 530, 760 530"/>
      <path id="w2" d="M 1160 530 C 1230 530, 1280 530, 1350 530"/>
    </svg>

    <div class="node clip" id="n1" data-start="0" data-duration="15" data-track-index="4">
      <div class="k">Input</div>
      <div class="h">footage <span style="color:#7C93B4;font-weight:400;">+</span> script</div>
    </div>
    <div class="node clip" id="n2" data-start="0" data-duration="15" data-track-index="5">
      <div class="k">The AI</div>
      <div class="h"><span class="accent">reads it</span> as text</div>
      <span class="tag">WhisperX</span>
    </div>
    <div class="node clip" id="n3" data-start="0" data-duration="15" data-track-index="6">
      <div class="k">Output</div>
      <div class="h"><span class="accent">cut to script</span></div>
      <span class="tag">29.97</span>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script>
    const drawIn = (sel) => { const p = document.querySelector(sel); const L = p.getTotalLength();
                              p.style.strokeDasharray = L; p.style.strokeDashoffset = L; return p; };
    const w1 = drawIn('#w1'), w2 = drawIn('#w2');

    const tl = gsap.timeline({ paused: true });
    tl.to({}, { duration: 15 }, 0); // slot anchor

    tl.fromTo('#eyebrow', { opacity:0, y:8 }, { opacity:1, y:0, duration:0.6, ease:'power2.out' }, 0.4);

    const nodeIn = (sel, at) => tl.fromTo(sel, { opacity:0, y:22, filter:'blur(7px)' },
                                          { opacity:1, y:0, filter:'blur(0px)', duration:0.6, ease:'power2.out' }, at);
    // build L->R: node, wire draws to next, node...
    nodeIn('#n1', 1.0);
    tl.to(w1, { strokeDashoffset:0, duration:0.6, ease:'power2.inOut' }, 1.7);
    nodeIn('#n2', 2.1);
    tl.fromTo('#n2 .tag', { opacity:0, y:6 }, { opacity:1, y:0, duration:0.4, ease:'power2.out' }, 2.7);
    tl.to(w2, { strokeDashoffset:0, duration:0.6, ease:'power2.inOut' }, 3.2);
    nodeIn('#n3', 3.6);
    // the payoff lands last in blossom and holds
    tl.fromTo('#n3 .tag', { opacity:0, scale:0.6, transformOrigin:'left center' },
                          { opacity:1, scale:1, duration:0.45, ease:'power2.out' }, 4.3);

    // gentle fade out at the tail (cut-room can also just cut out of the hold)
    tl.to('#stage', { opacity:0, duration:1.0, ease:'power2.in' }, 13.6);

    window.__timelines = window.__timelines || {};
    window.__timelines['resolve-pipeline-diagram'] = tl;
  </script>
</body>
</html>
