<!doctype html>
<!--
  proto-01-engaged — ENGAGED treatment prototype (cue 01 "codified", the minimal end).
  Same 4 levers as proto-0d: dressed scrim (blossom bar + top gradient + scale-in),
  clip-wipe reveal, payoff word "codified" -> blossom with highlight-sweep + underline draw
  + live beam. Punchier: codified at 40px. Transparent alpha over the repo hold ~1:48.8.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family:'Geist Mono'; font-weight:400; font-display:block; src:url(assets/fonts/GeistMono-400.woff2) format('woff2'); }
  @font-face { font-family:'Geist Mono'; font-weight:500; font-display:block; src:url(assets/fonts/GeistMono-500.woff2) format('woff2'); }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1920px; height:1080px; overflow:hidden; background:transparent; font-family:'Geist Mono',monospace; }
  #stage { position:relative; width:1920px; height:1080px; }

  #cue { position:absolute; left:120px; top:858px; }
  .scrim { position:relative; display:inline-block; padding:30px 40px 32px 42px; border-radius:12px;
           background:linear-gradient(180deg, rgba(255,255,255,0.06) 0%, rgba(255,255,255,0) 42%), rgba(8,14,24,0.86);
           box-shadow:0 14px 46px rgba(0,0,0,0.46); opacity:0; transform-origin:left center; }
  .bar { position:absolute; left:0; top:14px; bottom:14px; width:3px; border-radius:3px;
         background:#F0A8C2; transform:scaleY(0); transform-origin:top center; }
  .row { position:relative; overflow:hidden; }
  .txt { display:inline-block; font-weight:500; font-size:32px; letter-spacing:0.04em; color:#8995b0;
         white-space:nowrap; text-shadow:0 2px 18px rgba(0,0,0,0.65); }
  .pay { position:relative; display:inline-block; font-size:40px; }
  #sweep { position:absolute; left:-6px; right:-6px; top:2px; bottom:4px; border-radius:4px;
           background:rgba(240,168,194,0.16); transform:scaleX(0); transform-origin:left center; }
  #uline { position:absolute; left:0; right:0; bottom:-6px; height:3px; background:#F0A8C2;
           transform:scaleX(0); transform-origin:left center; }
  #beam { display:inline-block; width:3px; height:36px; margin-left:5px; vertical-align:-7px;
          background:#F0A8C2; opacity:0; }
</style>
</head>
<body data-hf-duration="5.5">
  <div id="stage" data-composition-id="proto-01-engaged" data-width="1920" data-height="1080" data-start="0" data-duration="5.5" data-track-index="1">
    <div id="cue" class="clip" data-start="0" data-duration="5.5" data-track-index="2">
      <div class="scrim">
        <div class="bar" id="bar"></div>
        <div class="row"><span class="txt">all been <span class="pay"><span id="sweep"></span>codified<span id="uline"></span></span><span id="beam"></span></span></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script>
    const tl = gsap.timeline({ paused: true });
    tl.to({}, { duration: 5.5 }, 0);

    tl.fromTo('.scrim', { opacity:0, scaleX:0.82, filter:'blur(6px)' },
                        { opacity:1, scaleX:1, filter:'blur(0px)', duration:0.55, ease:'power3.out' }, 0.3);
    tl.fromTo('#bar', { scaleY:0 }, { scaleY:1, duration:0.5, ease:'power2.out' }, 0.5);
    tl.fromTo('.txt', { clipPath:'inset(0 100% 0 0)', filter:'blur(4px)' },
                      { clipPath:'inset(0 0% 0 0)', filter:'blur(0px)', duration:0.55, ease:'power2.out' }, 0.55);

    // payoff: sweep + blossom + underline draw + beam
    tl.fromTo('#sweep', { scaleX:0 }, { scaleX:1, duration:0.4, ease:'power2.inOut' }, 1.4);
    tl.to('.pay', { color:'#F0A8C2', duration:0.4, ease:'power2.out' }, 1.55);
    tl.fromTo('#uline', { scaleX:0 }, { scaleX:1, duration:0.45, ease:'power2.inOut' }, 1.7);
    tl.to('#beam', { opacity:1, duration:0.12, repeat:5, yoyo:true, ease:'none' }, 1.6);
    tl.to('#beam', { opacity:0, duration:0.2 }, 2.6);

    tl.to('.scrim', { opacity:0, y:-10, duration:0.9, ease:'power2.in' }, 4.5);

    window.__timelines = window.__timelines || {};
    window.__timelines['proto-01-engaged'] = tl;
  </script>
</body>
</html>
