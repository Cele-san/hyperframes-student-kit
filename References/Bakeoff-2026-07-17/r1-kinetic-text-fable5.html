<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nobody Watches Past the First Ten Seconds</title>
<!--
  KINETIC TEXT — "Nobody watches past the first ten seconds."
  Concept: the composition IS the ten seconds. A live timer + YouTube-red
  progress bar run 0:00.0 → 0:10.0 while a retention HUD bleeds viewers.
  The sentence assembles, then its words leave the frame like an audience
  bailing — NOBODY is the only one left at 0%. Hard cut at 0:10.0,
  then the payoff: "still watching?"

  Beat map (real seconds):
   0.00  HUD in — timer, retention %, sparkline, progress bar start
   0.55  NOBODY        (clip-rise slam, chromatic split, micro-shake)
   1.45  WATCHES       (hard cut, skew settle)
   2.25  PAST          (squash pop)
   2.62  THE           (blink)
   2.95  FIRST         (scale slam + shake)
   3.62  TEN           (flash frame, big shake, giant outlined 10 behind)
   4.35  SECONDS.      (two-line lockup, pulses on each second tick)
   5.48  Full sentence assembles (blur-stagger)
   6.50  The drain — words exit one by one, retention cliff-dives
   7.92  NOBODY re-centers, alone, audience 0%
   9.20  HARD CUT at 0:10.0 — black
   9.48  "still watching?" types on, cursor blinks. End ~10.3s
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a0c;
    --ink:#f4f4f1;
    --red:#ff2a3c;
    --yt:#ff0033;
    --dim:#85858d;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;background:#000;overflow:hidden}
  body{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}

  /* ---------- 1920x1080 stage, scaled to fit viewport ---------- */
  #stage{
    position:absolute;top:50%;left:50%;
    width:1920px;height:1080px;
    transform:translate(-50%,-50%) scale(1);
    background:var(--bg);
    overflow:hidden;
  }
  #shake{position:absolute;inset:0;will-change:transform}

  #glow{
    position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(ellipse 980px 620px at 50% 46%,rgba(255,255,255,.05),transparent 70%);
  }

  /* ---------- kinetic type ---------- */
  .anton{font-family:'Anton',Impact,sans-serif;color:var(--ink);line-height:.92;letter-spacing:.01em}
  .mono{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace}

  #words{position:absolute;inset:0;z-index:3}
  .word{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden}
  .word span{display:block;will-change:transform,opacity,filter}

  /* chromatic split driven by --ab (GSAP animates the var to 0) */
  .kt{
    --ab:0;
    text-shadow:
      calc(var(--ab)*1px) 0 rgba(255,32,64,.85),
      calc(var(--ab)*-1px) 0 rgba(64,224,255,.55);
  }

  #tenLock{position:absolute;inset:0;z-index:3;opacity:0;visibility:hidden}
  .layer{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
  #g10 span{
    font-size:950px;line-height:.9;
    color:rgba(255,42,60,.04);
    -webkit-text-stroke:3px rgba(255,42,60,.55);
    opacity:0;visibility:hidden;
    will-change:transform,opacity;
  }
  #tenWord span{font-size:360px}
  #secWord span{font-size:135px;letter-spacing:.05em;color:var(--red)}

  #lockup{
    position:absolute;inset:0;z-index:4;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:14px;
    opacity:0;visibility:hidden;
  }
  .lline{font-family:'Anton',Impact,sans-serif;font-size:150px;line-height:1.02;color:var(--ink);text-align:center;white-space:nowrap}
  .lline .lw{display:inline-block;margin:0 22px;will-change:transform,opacity,filter}
  .lline.red .lw{color:var(--red)}

  /* ---------- HUD ---------- */
  #hud{position:absolute;inset:0;z-index:5;pointer-events:none;opacity:0;visibility:hidden}
  #live{
    position:absolute;top:64px;left:70px;
    font-family:'JetBrains Mono',monospace;font-size:21px;font-weight:500;
    letter-spacing:.18em;color:var(--dim);
    display:flex;align-items:center;gap:14px;
  }
  .ldot{width:11px;height:11px;border-radius:50%;background:var(--red);animation:ldot 1.1s steps(2,jump-none) infinite}
  @keyframes ldot{0%{opacity:1}50%{opacity:.25}100%{opacity:1}}

  #timer{
    position:absolute;top:54px;right:70px;
    font-family:'JetBrains Mono',monospace;font-size:46px;font-weight:700;
    color:#e8e8ea;letter-spacing:.02em;
    will-change:transform;
  }
  #timer .tmax{font-size:30px;font-weight:400;color:#55555c}

  #sparkwrap{position:absolute;left:70px;bottom:46px}
  #retwrap{font-family:'JetBrains Mono',monospace;font-size:20px;font-weight:500;letter-spacing:.14em;color:var(--dim);margin-bottom:10px}
  #ret{color:#d7d7db;font-weight:700}
  #spark{display:block;opacity:.9}

  /* ---------- YouTube-style progress bar ---------- */
  #bar{position:absolute;left:0;right:0;bottom:0;height:6px;background:rgba(255,255,255,.08);z-index:6}
  #barFill{position:absolute;inset:0;background:var(--yt);transform:scaleX(0);transform-origin:left center;will-change:transform}
  #barDot{
    position:absolute;bottom:-4px;left:-7px;width:14px;height:14px;border-radius:50%;
    background:var(--yt);box-shadow:0 0 14px rgba(255,0,51,.85);will-change:transform;
  }

  /* ---------- overlays ---------- */
  #flash{position:absolute;inset:0;background:#fff;opacity:0;visibility:hidden;z-index:7;pointer-events:none}

  #tag{
    position:absolute;inset:0;z-index:8;
    display:flex;align-items:center;justify-content:center;
    font-family:'JetBrains Mono',monospace;font-size:44px;font-weight:400;
    letter-spacing:.08em;color:#b9b9c0;
    opacity:0;visibility:hidden;
  }
  #tag .ch{opacity:0}
  #cursor{
    display:inline-block;width:.62em;height:1.15em;margin-left:.18em;
    background:#b9b9c0;vertical-align:text-bottom;
    animation:blink 1.06s steps(1) infinite;
  }
  @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}

  #grain{
    position:absolute;inset:0;z-index:9;pointer-events:none;opacity:.055;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='240' height='240'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='240' height='240' filter='url(%23n)'/%3E%3C/svg%3E");
  }
  #vig{
    position:absolute;inset:0;z-index:10;pointer-events:none;
    background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.5) 100%);
  }

  /* ---------- no-GSAP fallback: show the finished lockup ---------- */
  body.nogsap #lockup, body.nogsap #hud{opacity:1;visibility:visible}
  body.nogsap .lline .lw{opacity:1;visibility:visible}
</style>
</head>
<body>
<div id="stage">
  <div id="shake">
    <div id="glow"></div>

    <div id="words">
      <div class="word anton" id="s-nobody"><span class="kt" style="font-size:300px">NOBODY</span></div>
      <div class="word anton" id="s-watches"><span class="kt" style="font-size:280px">WATCHES</span></div>
      <div class="word anton" id="s-past"><span class="kt" style="font-size:260px">PAST</span></div>
      <div class="word anton" id="s-the"><span class="kt" style="font-size:130px;color:#9a9aa2">THE</span></div>
      <div class="word anton" id="s-first"><span class="kt" style="font-size:330px">FIRST</span></div>
    </div>

    <div id="tenLock" class="anton">
      <div class="layer" id="g10"><span>10</span></div>
      <div class="layer" id="tenWord"><span class="kt">TEN</span></div>
      <div class="layer" id="secWord"><span class="kt">SECONDS.</span></div>
    </div>

    <div id="lockup">
      <div class="lline"><span class="lw" id="w-nobody">NOBODY</span><span class="lw" id="w-watches">WATCHES</span></div>
      <div class="lline"><span class="lw" id="w-past">PAST</span><span class="lw" id="w-the">THE</span><span class="lw" id="w-first">FIRST</span></div>
      <div class="lline red"><span class="lw" id="w-ten">TEN</span><span class="lw" id="w-seconds">SECONDS.</span></div>
    </div>

    <div id="hud">
      <div id="live"><span class="ldot"></span>LIVE · AVG. VIEWER RETENTION</div>
      <div id="timer"><span id="tcur">0:00.0</span><span class="tmax"> / 0:10.0</span></div>
      <div id="sparkwrap">
        <div id="retwrap">AUDIENCE&nbsp;&nbsp;<span id="ret">100%</span></div>
        <svg id="spark" width="300" height="64" viewBox="0 0 300 64">
          <line x1="0" y1="62" x2="300" y2="62" stroke="rgba(255,255,255,.14)" stroke-width="1"/>
          <polyline id="sline" fill="none" stroke="#ff2a3c" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" points=""/>
          <circle id="sdot" r="3.5" fill="#ff2a3c" cx="0" cy="8"/>
        </svg>
      </div>
    </div>

    <div id="bar">
      <div id="barFill"></div>
      <div id="barDot"></div>
    </div>
  </div>

  <div id="flash"></div>

  <div id="tag"><span id="cursor"></span></div>

  <div id="grain"></div>
  <div id="vig"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
(function(){
  'use strict';

  /* ---------- fit 1920x1080 stage to any viewport ---------- */
  var stage = document.getElementById('stage');
  function fit(){
    var s = Math.min(window.innerWidth/1920, window.innerHeight/1080);
    stage.style.transform = 'translate(-50%,-50%) scale(' + s + ')';
  }
  window.addEventListener('resize', fit);
  fit();

  /* ---------- payoff tag: build character spans ---------- */
  var tagEl  = document.getElementById('tag');
  var cursor = document.getElementById('cursor');
  'still watching?'.split('').forEach(function(c){
    var s = document.createElement('span');
    s.className = 'ch';
    s.textContent = (c === ' ') ? ' ' : c;
    tagEl.insertBefore(s, cursor);
  });

  /* ---------- retention curve: slow bleed, then the cliff ---------- */
  /* rt = real seconds 0..9.2 (the timer's ten seconds)              */
  function retention(rt){
    var r;
    if      (rt < 3.6) r = 100 - 12 * (rt / 3.6);            /* 100 -> 88 */
    else if (rt < 6.5) r = 88  - 17 * ((rt - 3.6) / 2.9);    /*  88 -> 71 */
    else if (rt < 8.0) r = 71  - 65 * ((rt - 6.5) / 1.5);    /*  cliff -> 6 */
    else               r = 6   - 6  * ((rt - 8.0) / 1.2);    /*   6 -> 0  */
    var wob = Math.sin(rt * 6.1) * Math.min(1.1, r * 0.02);
    return Math.max(0, Math.min(100, r + wob));
  }

  function fmtTimer(t){
    t = Math.min(10, Math.max(0, t));
    var s = Math.floor(t);
    var d = Math.floor((t - s) * 10);
    return '0:' + (s < 10 ? '0' + s : s) + '.' + d;
  }

  function start(){
    if (!window.gsap){ document.body.classList.add('nogsap'); return; }
    gsap.config({ force3D:true });

    /* measure NOBODY's spot in the lockup so it can re-center later
       (layout is stable here: fonts are loaded, visibility:hidden keeps flow) */
    var nb = document.getElementById('w-nobody');
    var shiftX = 960 - (nb.offsetLeft + nb.offsetWidth  / 2);
    var shiftY = 540 - (nb.offsetTop  + nb.offsetHeight / 2);

    var tcur  = document.getElementById('tcur');
    var retEl = document.getElementById('ret');
    var sline = document.getElementById('sline');
    var sdot  = document.getElementById('sdot');
    gsap.set('#timer', { transformOrigin:'right center' });

    var state = { t:0 };            /* displayed seconds 0..10 */
    var lastS = 0, lastX = -10;
    var pts = [];

    function tickPulse(){
      gsap.fromTo('#timer', { scale:1.12 }, { scale:1, duration:.28, ease:'power2.out' });
      var rt = state.t * 0.92;
      if (rt > 4.25 && rt < 5.25){
        gsap.fromTo('#g10 span', { scale:1.05 }, { scale:1, duration:.3, ease:'power2.out' });
      }
    }

    function updateHUD(){
      var t  = state.t;
      var rt = t * 0.92;                       /* real seconds elapsed */
      tcur.textContent = fmtTimer(t);

      var s = Math.floor(t);
      if (s > lastS){ lastS = s; if (s <= 9) tickPulse(); }

      var r = retention(rt);
      retEl.textContent = Math.max(0, Math.round(r)) + '%';
      retEl.style.color = (r < 35) ? '#ff2a3c' : '#d7d7db';

      var x = rt / 9.2 * 300;
      if (x - lastX >= 1.2){
        lastX = x;
        var y = 62 - (r / 100) * 54;
        pts.push(x.toFixed(1) + ',' + y.toFixed(1));
        sline.setAttribute('points', pts.join(' '));
        sdot.setAttribute('cx', x.toFixed(1));
        sdot.setAttribute('cy', y.toFixed(1));
      }
    }

    var tl = gsap.timeline({ paused:true, defaults:{ ease:'power4.out' } });

    function shakeAt(at, mag, times){
      var kf = [];
      for (var i = 0; i < times; i++){
        var d = mag * (1 - i / times);
        kf.push({ x:(i % 2 ? d : -d) * 0.9, y:(i % 2 ? -d : d) * 0.55, duration:0.032 });
      }
      kf.push({ x:0, y:0, duration:0.05 });
      tl.to('#shake', { keyframes: kf }, at);
    }

    /* ---------- the honest clock: timer, bar, retention, sparkline ---------- */
    tl.to(state, { t:10, duration:9.2, ease:'none', onUpdate:updateHUD }, 0);
    tl.fromTo('#barFill', { scaleX:0 }, { scaleX:1, duration:9.2, ease:'none' }, 0);
    tl.fromTo('#barDot',  { x:0 },     { x:1920,  duration:9.2, ease:'none' }, 0);
    tl.fromTo('#hud', { autoAlpha:0 }, { autoAlpha:1, duration:.5, ease:'power2.out' }, 0.12);

    /* ---------- staccato: one word at a time, hard cuts ---------- */
    /* NOBODY — clip-rise slam */
    tl.set('#s-nobody', { autoAlpha:1 }, 0.55);
    tl.fromTo('#s-nobody span',
      { clipPath:'inset(100% 0% 0% 0%)', y:60, scale:1.18, '--ab':14 },
      { clipPath:'inset(0% 0% 0% 0%)',   y:0,  scale:1,    '--ab':0, duration:.5, ease:'power4.out' }, 0.55);
    shakeAt(0.62, 8, 4);
    tl.set('#s-nobody', { autoAlpha:0 }, 1.45);

    /* WATCHES — hard cut, skew settle */
    tl.set('#s-watches', { autoAlpha:1 }, 1.45);
    tl.fromTo('#s-watches span',
      { scaleX:1.35, skewX:-10, '--ab':10 },
      { scaleX:1,    skewX:0,   '--ab':0, duration:.34, ease:'power3.out' }, 1.45);
    tl.set('#s-watches', { autoAlpha:0 }, 2.25);

    /* PAST — squash pop */
    tl.set('#s-past', { autoAlpha:1 }, 2.25);
    tl.fromTo('#s-past span',
      { scaleY:.25, scaleX:1.5 },
      { scaleY:1,   scaleX:1, duration:.3, ease:'back.out(2.2)' }, 2.25);
    tl.set('#s-past', { autoAlpha:0 }, 2.62);

    /* THE — blink, small and dim (a throwaway beat before the hit) */
    tl.set('#s-the', { autoAlpha:1 }, 2.62);
    tl.fromTo('#s-the span', { opacity:0 }, { opacity:1, duration:.14, ease:'steps(2)' }, 2.62);
    tl.set('#s-the', { autoAlpha:0 }, 2.95);

    /* FIRST — scale slam */
    tl.set('#s-first', { autoAlpha:1 }, 2.95);
    tl.fromTo('#s-first span',
      { scale:1.9, opacity:0, '--ab':18 },
      { scale:1,   opacity:1, '--ab':0, duration:.38, ease:'power4.out' }, 2.95);
    shakeAt(3.0, 11, 5);
    tl.set('#s-first', { autoAlpha:0 }, 3.62);

    /* ---------- TEN / SECONDS. — the hit ---------- */
    tl.set('#tenLock', { autoAlpha:1 }, 3.62);
    tl.fromTo('#flash', { autoAlpha:.8 }, { autoAlpha:0, duration:.18, ease:'power2.out' }, 3.62);
    tl.fromTo('#g10 span',
      { scale:1.35, autoAlpha:0 },
      { scale:1,    autoAlpha:.85, duration:.55, ease:'power3.out' }, 3.62);
    tl.fromTo('#tenWord span',
      { scale:2, autoAlpha:0, '--ab':22 },
      { scale:1, autoAlpha:1, '--ab':0, duration:.42, ease:'power4.out' }, 3.62);
    shakeAt(3.64, 16, 6);

    tl.to('#tenWord span', { y:-120, duration:.5, ease:'power3.inOut' }, 4.32);
    tl.fromTo('#secWord span',
      { y:210, autoAlpha:0, '--ab':12 },
      { y:122, autoAlpha:1, '--ab':0, duration:.45, ease:'power4.out' }, 4.42);
    shakeAt(4.5, 7, 4);

    tl.to('#tenLock', { autoAlpha:0, scale:1.05, duration:.22, ease:'power2.in' }, 5.32);

    /* ---------- the whole line assembles ---------- */
    tl.set('#lockup', { autoAlpha:1 }, 5.48);
    tl.fromTo('.lline .lw',
      { y:36, autoAlpha:0, filter:'blur(14px)' },
      { y:0,  autoAlpha:1, filter:'blur(0px)', duration:.42, ease:'power3.out', stagger:.05 }, 5.48);

    /* ---------- the drain: words leave like viewers ---------- */
    var drain = [
      ['#w-the',     6.50, -6],
      ['#w-past',    6.78,  5],
      ['#w-first',   7.04, -4],
      ['#w-watches', 7.27,  6],
      ['#w-seconds', 7.47, -5],
      ['#w-ten',     7.65,  4]
    ];
    drain.forEach(function(d){
      tl.to(d[0], { y:90, rotation:d[2], autoAlpha:0, duration:.34, ease:'power2.in' }, d[1]);
    });

    /* NOBODY is the only one left — it takes the center */
    tl.to('#w-nobody', { x:shiftX, y:shiftY, scale:1.45, duration:.65, ease:'power3.inOut' }, 7.92);

    /* signal dying */
    tl.to('#w-nobody', { keyframes:[
      { opacity:.3,  duration:.05 },
      { opacity:1,   duration:.06 },
      { opacity:.15, duration:.05 },
      { opacity:.75, duration:.06 },
      { opacity:.3,  duration:.06 },
      { opacity:.85, duration:.07 }
    ]}, 8.72);

    /* ---------- 0:10.0 — hard cut ---------- */
    tl.set(['#hud','#words','#tenLock','#lockup','#glow','#bar'], { autoAlpha:0 }, 9.2);

    /* ---------- payoff ---------- */
    tl.set('#tag', { autoAlpha:1 }, 9.45);
    tl.fromTo('#tag .ch', { opacity:0 }, { opacity:1, duration:.02, stagger:.04, ease:'none' }, 9.45);
    tl.to({}, { duration:.1 }, 10.1);   /* hold the end frame */

    tl.play(0);
  }

  /* wait (briefly) for the display faces so slams land in Anton, not fallback */
  var fontsLoaded = Promise.resolve();
  if (document.fonts && document.fonts.load){
    fontsLoaded = Promise.all([
      document.fonts.load('400 100px Anton'),
      document.fonts.load('700 40px "JetBrains Mono"'),
      document.fonts.load('400 40px "JetBrains Mono"')
    ]).catch(function(){});
  }
  Promise.race([ fontsLoaded, new Promise(function(r){ setTimeout(r, 1200); }) ])
    .then(function(){
      requestAnimationFrame(function(){ requestAnimationFrame(start); });
    });
})();
</script>
</body>
</html>
